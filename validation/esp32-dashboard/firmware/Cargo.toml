# Host-side firmware workspace (separate from the EAK root workspace).
# `esp32c3/` is the device binary; it is its own workspace because it targets
# riscv32imc-unknown-none-elf (see esp32c3/.cargo/config.toml).
[workspace]
resolver = "2"
members = ["dashboard-core", "dashboard-host"]
exclude = ["esp32c3"]

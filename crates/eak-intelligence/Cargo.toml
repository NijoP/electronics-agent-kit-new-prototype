[package]
name = "eak-intelligence"
description = "EAK Intelligence Engine: model providers, typed tools over design commands, approval-gated agent loop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eak-core.workspace = true
eak-engineering.workspace = true
eak-validation.workspace = true
eak-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Optional HTTPS client for the model providers (feature `remote-http`, off by default so the
# offline build has no network stack). rustls (pure Rust TLS) keeps the build identical on
# Windows, Linux and macOS without a system OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
default = []
# Live HTTPS to OpenAI-compatible, Anthropic and Ollama endpoints.
remote-http = ["dep:ureq"]

[lints]
workspace = true

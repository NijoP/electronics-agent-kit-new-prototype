[package]
name = "eak-terminal"
description = "EAK terminal workspace engine: real OS pseudo-terminal sessions, process-derived status and an authenticated local control API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "eak-term"
path = "src/bin/eak-term.rs"

[dependencies]
portable-pty = "0.9"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

# Windows: find the program running inside a shell (process snapshot) and read its command line.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[lints]
workspace = true

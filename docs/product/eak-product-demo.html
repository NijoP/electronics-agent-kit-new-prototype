<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAK product demo: an electronics engineer's journey</title>
<!--
  EAK product demo / storyboard. Self-contained: no network, no build step.
  This is NOT the EAK application. It shows the proposed product experience on top of
  what EAK already has. Every surface carries an EXISTS or PROPOSED badge.
  Colours and type follow apps/desktop/src/design/tokens.css (dark theme).
  See docs/product/README.md.
-->
<style>
:root{
  --s-half:4px;--s-1:8px;--s-1h:12px;--s-2:16px;--s-3:24px;--r-1:4px;--r-2:8px;--r-pill:999px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --fs-2xs:10px;--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-lg:15px;--fs-xl:18px;--fs-2xl:22px;
  --h-row:22px;--h-sm:24px;--h-md:28px;--h-bar:34px;--h-tab:42px;
  --bg-canvas:#0d0f11;--bg-app:#14161a;--bg-panel:#181b1f;--bg-raised:#1f2328;--bg-hover:#262b31;--bg-active:#2d333a;
  --line:#262a30;--line-strong:#363c44;--fg:#e6e8eb;--fg-dim:#9aa2ad;--fg-faint:#6b727c;
  --accent:#e8c35a;--accent-fg:#1a1505;--accent-soft:rgba(232,195,90,.14);
  --err:#ff8a80;--warn:#e8c35a;--ok:#8fd694;--info:#79b8ff;--neutral:#6b727c;
  --err-soft:color-mix(in srgb,var(--err) 18%,transparent);--warn-soft:color-mix(in srgb,var(--warn) 18%,transparent);
  --ok-soft:color-mix(in srgb,var(--ok) 16%,transparent);--info-soft:color-mix(in srgb,var(--info) 16%,transparent);
  --term-bg:#0a0b0d;--c-sheet:#12151a;--shadow:0 16px 48px rgba(0,0,0,.5);
  --proposed:#c9a0ff;--proposed-soft:color-mix(in srgb,#c9a0ff 16%,transparent);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg-canvas);color:var(--fg);font:var(--fs-md)/1.45 var(--font)}
button{font:inherit;color:inherit;background:var(--bg-raised);border:1px solid var(--line-strong);border-radius:var(--r-1);height:var(--h-sm);padding:0 10px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--bg-hover)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-soft)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--bg-hover)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg-canvas);border:1px solid var(--line-strong);border-radius:var(--r-1);height:var(--h-sm);padding:0 8px}
textarea{height:auto;padding:8px;resize:vertical}
.mono{font-family:var(--mono)}
.dim{color:var(--fg-dim)}.faint{color:var(--fg-faint)}
.row{display:flex;gap:var(--s-1);align-items:center;min-width:0}
.col{display:flex;flex-direction:column;gap:var(--s-1);min-width:0}
.grow{flex:1;min-width:0}
.caps{font-size:var(--fs-2xs);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);font-weight:600}
.b{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:var(--r-pill);font-size:9.5px;font-weight:700;letter-spacing:.05em;vertical-align:middle;cursor:help;flex:none}
.b.ex{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.b.pr{background:var(--proposed-soft);color:var(--proposed);border:1px dashed var(--proposed)}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:var(--r-pill);font-size:var(--fs-xs);background:var(--bg-raised);border:1px solid var(--line);white-space:nowrap}
.chip.err{background:var(--err-soft);color:var(--err);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.unk{background:transparent;color:var(--fg-dim);border:1px dashed var(--fg-faint)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.proposed-zone{outline:1px dashed color-mix(in srgb,var(--proposed) 55%,transparent);outline-offset:-1px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);font-size:var(--fs-sm);vertical-align:top}
th{color:var(--fg-faint);font-weight:600;font-size:var(--fs-xs);position:sticky;top:0;background:var(--bg-panel)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg-hover)}
tr.sel td{background:var(--accent-soft)}

/* ---- demo chrome ---- */
#demoBar{display:flex;align-items:center;gap:var(--s-2);padding:6px 12px;background:#0b0c0e;border-bottom:1px solid var(--line);flex-wrap:wrap}
#demoBar .title{font-weight:600}
#legend{display:flex;gap:10px;align-items:center;font-size:var(--fs-xs);color:var(--fg-dim);flex-wrap:wrap}
#shell{display:grid;grid-template-columns:minmax(0,1fr) auto;height:calc(100vh - 40px);min-height:620px}
#app{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg-app);border-right:1px solid var(--line)}
#story{width:340px;background:var(--bg-panel);overflow:auto;padding:var(--s-2);display:flex;flex-direction:column;gap:var(--s-1h)}
#story.hidden{display:none}
#story h3{margin:0;font-size:var(--fs-lg)}
.story-card{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-2);padding:10px 12px}
.story-card dt{font-size:var(--fs-2xs);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint);font-weight:700;margin-top:6px}
.story-card dd{margin:2px 0 0;font-size:var(--fs-sm)}
.stepdots{display:flex;flex-wrap:wrap;gap:4px}
.stepdots button{height:20px;min-width:24px;padding:0 5px;font-size:var(--fs-2xs)}
.stepdots button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

/* ---- app title bar ---- */
#titlebar{display:flex;align-items:center;gap:var(--s-1);height:var(--h-bar);padding:0 8px;border-bottom:1px solid var(--line);background:var(--bg-panel)}
#titlebar .brand{font-weight:700;letter-spacing:.04em;color:var(--accent);margin-right:6px}
.wsbtn{height:26px}
.wsbtn.on{background:var(--bg-active);border-color:var(--accent)}
#rev{font-family:var(--mono);font-size:var(--fs-xs);color:var(--fg-dim)}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.screen{display:none;flex:1;min-height:0}
.screen.on{display:flex}

/* ---- home ---- */
#home{overflow:auto;justify-content:center}
.home-inner{width:min(980px,100%);padding:28px 24px;display:flex;flex-direction:column;gap:18px}
.prompt{background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:12px;padding:12px}
.prompt textarea{width:100%;border:none;background:transparent;min-height:56px;font-size:var(--fs-lg)}
.prompt textarea:focus-visible{box-shadow:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--r-2);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--line-strong);background:var(--bg-raised)}
.card h4{margin:0;font-size:var(--fs-md)}

/* ---- EDA workspace ---- */
#eda{flex-direction:column}
#journey{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg-panel);overflow-x:auto}
.stage{display:flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:var(--r-1);background:var(--bg-raised);border:1px solid var(--line);font-size:var(--fs-xs);cursor:pointer;white-space:nowrap}
.stage:hover{background:var(--bg-hover)}
.stage.cur{border-color:var(--accent)}
.stage .n{font-family:var(--mono);color:var(--fg-faint)}
#toolbar{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
#toolbar .sep{width:1px;height:18px;background:var(--line-strong)}
#edaBody{flex:1;min-height:0;display:grid;grid-template-columns:44px 240px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) 210px}
#activity{grid-column:1;grid-row:1/3;background:var(--bg-panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px}
#activity button{width:38px;height:34px;padding:0;font-size:9px;border-color:transparent;background:transparent;line-height:1.05;white-space:normal}
#activity button.on{background:var(--bg-active);border-left:2px solid var(--accent)}
#side .chip{white-space:normal;height:auto;padding:1px 7px}
#side{grid-column:2;grid-row:1;background:var(--bg-panel);border-right:1px solid var(--line);overflow:auto;padding:8px}
#center{grid-column:3;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--c-sheet)}
#edTabs{display:flex;gap:2px;padding:4px 6px 0;background:var(--bg-panel);border-bottom:1px solid var(--line)}
#edTabs button{border-bottom:none;border-radius:var(--r-1) var(--r-1) 0 0}
#edTabs button.on{background:var(--c-sheet);border-color:var(--accent)}
#canvas{flex:1;min-height:0;position:relative;overflow:hidden}
#canvas svg{width:100%;height:100%;display:block}
#right{grid-column:4;grid-row:1/3;background:var(--bg-panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#rightTabs{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line)}
#rightTabs button.on{background:var(--bg-active);border-color:var(--accent)}
#rightBody{flex:1;overflow:auto;padding:10px;min-height:0}
#bottom{grid-column:2/4;grid-row:2;border-top:1px solid var(--line);background:var(--bg-panel);display:flex;flex-direction:column;min-height:0}
#botTabs{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#botTabs button.on{background:var(--bg-active);border-color:var(--accent)}
#botBody{flex:1;overflow:auto;min-height:0}
.prob{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);font-size:var(--fs-sm)}
.prob:hover{background:var(--bg-hover)}
.sym{cursor:pointer}
.sym rect.body{fill:#171b21;stroke:#8fa3b8;stroke-width:1.2}
.sym:hover rect.body{stroke:var(--accent)}
.sym.sel rect.body{stroke:var(--accent);stroke-width:2}
.sym.new rect.body{stroke:var(--proposed);stroke-dasharray:4 2}
.sym.flash rect.body{stroke:var(--err);stroke-width:2.4}
.wire{stroke:#5fb878;stroke-width:1.3;fill:none}
.net{fill:#e6c07b;font:10px var(--mono)}
.ref{fill:var(--fg);font:600 11px var(--font)}
.val{fill:var(--fg-dim);font:10px var(--font)}
.fp{cursor:pointer}
.fp rect.body{fill:#1e2a1e;stroke:#c9b458;stroke-width:1}
.fp.sel rect.body{stroke:var(--accent);stroke-width:2}
.fp.flash rect.body{stroke:var(--err);stroke-width:2.4}
.rats{stroke:#8ab4f8;stroke-width:.8;stroke-dasharray:3 3}
.track{stroke:#c0504d;stroke-width:2.4;fill:none;stroke-linecap:round}
.track.b{stroke:#4f81bd}
.ins{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.overlay-note{position:absolute;right:10px;top:10px;background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-2);padding:6px 10px;font-size:var(--fs-xs);max-width:320px}

/* ---- 3D ---- */
#v3d{width:100%;height:100%;display:flex;align-items:center;justify-content:center;perspective:900px;background:radial-gradient(circle at 50% 40%,#1a1f26,#0d0f11)}
#board3d{width:400px;height:280px;position:relative;transform-style:preserve-3d;transition:transform .5s ease}
#board3d .pcb{position:absolute;inset:0;background:#1f5130;border:2px solid #2c6b41;border-radius:6px}
#board3d .cmp{position:absolute;transform-style:preserve-3d}
#board3d .cmp .top{position:absolute;inset:0;border-radius:2px;border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;text-align:center;font:600 9px var(--font);color:#fff}
#board3d .cmp.tall .top{box-shadow:0 0 0 2px var(--warn)}

/* ---- terminal (as today) ---- */
#term{flex-direction:row;min-height:0}
#termSide{width:210px;background:var(--bg-panel);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px;overflow:auto}
#termMain{flex:1;display:flex;flex-direction:column;min-width:0}
#termTabs{display:flex;gap:2px;padding:4px;background:var(--bg-panel);border-bottom:1px solid var(--line);align-items:center}
#termTabs .tab{display:flex;align-items:center;gap:6px}
#termTabs .tab.on{background:var(--bg-active);border-color:var(--accent)}
#termPanes{flex:1;display:flex;min-height:0}
.pane{flex:1;background:var(--term-bg);font:12px/1.5 var(--mono);padding:8px;overflow:auto;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.pane.focus{outline:1px solid var(--line-strong);outline-offset:-1px}
.pane .out{white-space:pre-wrap;flex:1}
.pane input{background:transparent;border:none;font:inherit;color:var(--fg);width:100%;height:auto;padding:0}
.pane input:focus-visible{box-shadow:none}
#termDetails{width:230px;background:var(--bg-panel);border-left:1px solid var(--line);padding:8px;overflow:auto;font-size:var(--fs-sm)}
#termDetails dl{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;margin:0}
#termDetails dt{color:var(--fg-faint)}#termDetails dd{margin:0;word-break:break-all}

/* ---- settings ---- */
#settings{flex-direction:row}
#setNav{width:200px;background:var(--bg-panel);border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:4px}
#setNav button{text-align:left;display:flex;gap:6px;align-items:center}
#setNav button.on{background:var(--bg-active);border-color:var(--accent)}
#setBody{flex:1;overflow:auto;padding:16px 20px}
.toolrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r-2);background:var(--bg-panel);margin-bottom:8px}

/* ---- modal, toast, status ---- */
#modalWrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:30}
#modalWrap.on{display:flex}
#modal{width:min(760px,94vw);max-height:86vh;overflow:auto;background:var(--bg-panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
#modal h2{margin:0;font-size:var(--fs-xl)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg-raised);border:1px solid var(--line-strong);border-radius:var(--r-2);padding:8px 14px;box-shadow:var(--shadow);display:none;z-index:40;max-width:80vw;font-size:var(--fs-sm)}
#toast.on{display:block}
#statusbar{height:24px;display:flex;align-items:center;gap:12px;padding:0 8px;border-top:1px solid var(--line);background:var(--bg-panel);font-size:var(--fs-xs);color:var(--fg-dim);overflow:hidden;white-space:nowrap}
.bubble{background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-2);padding:8px 10px;font-size:var(--fs-sm)}
.bubble.me{background:var(--accent-soft);border-color:transparent;align-self:flex-end;max-width:90%}
.qopt{display:block;width:100%;text-align:left;margin-top:4px;height:auto;padding:5px 8px;white-space:normal}
.plan li{margin:3px 0;font-size:var(--fs-sm)}
.plan li.done{color:var(--ok)}.plan li.run{color:var(--info)}
@media (max-width:1180px){#story{width:280px}#edaBody{grid-template-columns:44px 200px minmax(0,1fr) 260px}}
</style>
</head>
<body>
<div id="demoBar">
  <span class="title">EAK product demo</span>
  <span class="dim" style="font-size:var(--fs-xs)">A storyboard you can click. This is not the EAK app: sample project, simulated checks, nothing leaves this page.</span>
  <span class="grow"></span>
  <div id="legend">
    <span class="b ex" title="Exists in EAK on main today. Hover any badge for the file or test that backs it.">EXISTS</span><span>in EAK today (hover for evidence)</span>
    <span class="b pr" title="Proposed, not built. Dashed outline marks proposed areas.">PROPOSED</span><span>new, dashed outline</span>
  </div>
  <button data-act="toggleStory" id="storyBtn">Hide storyboard</button>
  <button data-act="resetDemo">Reset demo</button>
</div>
<div id="shell">
  <div id="app">
    <div id="titlebar">
      <span class="brand">EAK</span>
      <button class="wsbtn on" data-act="ws" data-arg="home">Home</button>
      <button class="wsbtn" data-act="ws" data-arg="eda">EDA workspace</button>
      <button class="wsbtn" data-act="ws" data-arg="term">Terminal</button>
      <button class="wsbtn" data-act="ws" data-arg="settings">Settings</button>
      <span class="grow"></span>
      <span id="projName" class="dim" style="font-size:var(--fs-sm)"></span>
      <span id="rev"></span>
    </div>
    <div id="main">
      <section class="screen on" id="home"></section>
      <section class="screen" id="eda">
        <div id="journey" class="proposed-zone"></div>
        <div id="toolbar"></div>
        <div id="edaBody">
          <nav id="activity"></nav>
          <aside id="side"></aside>
          <div id="center"><div id="edTabs"></div><div id="canvas"></div></div>
          <aside id="right"><div id="rightTabs"></div><div id="rightBody"></div></aside>
          <div id="bottom"><div id="botTabs"></div><div id="botBody"></div></div>
        </div>
      </section>
      <section class="screen" id="term"></section>
      <section class="screen" id="settings"></section>
    </div>
    <div id="statusbar"></div>
  </div>
  <aside id="story"></aside>
</div>
<div id="modalWrap"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================================
   Evidence behind each EXISTS badge (file, ADR or ui-evidence scenario on EAK main),
   and the report slice behind each PROPOSED badge.
   ========================================================================== */
const EV = {
  home:"ProjectHome.tsx: Open / New project, Continue working card, Recent table",
  newproj:"New Project dialog (ProjectHome.tsx). Not yet driven in a real window by ui-evidence",
  kicad:"KiCad import: apps/desktop/src-tauri/src/kicad.rs",
  shell:"Workspace shell: shell/ActivityBar.tsx side views Overview, Explorer, Design manager, Domain, Manufacturing, Assets",
  overview:"shell/ProjectOverview.tsx: read-only facts; a check that was not run says 'Not run', never passing",
  explorer:"shell/FileExplorer.tsx (Explorer side view)",
  schematic:"SchematicView.tsx: PlaceSymbol, AddWire, AddNetLabel, sheets; ui-evidence b2, b3, b4, b6, e2, f3",
  pcb:"PCB editor; ui-evidence c1, c3, c4, e5, f2",
  v3d:"viewer3d/Viewer3D.tsx: presets, ortho, measure; ui-evidence c6. Limits: arcs and cut-outs ignored, no collision check, no STEP export",
  erc:"Run ERC -> Findings (EngineeringMonitor.tsx); ui-evidence b5, f7 (a click goes to the right sheet)",
  findings:"Findings tab (EngineeringMonitor.tsx) with CSV/JSON export",
  drc:"eak-validation/src/drc.rs, realtimeDrc.ts, Rules dialog; ui-evidence c4, f10. Rules that need V/I stay UNKNOWN until declared",
  eco:"Update PCB = ERC gate -> EcoPreviewDialog.tsx (preview on a project copy, eco.rs) -> SyncSchematicToPcb as one Batch; ADR-0041; ui-evidence c2",
  autoplace:"AutoPlace command; ui-evidence d2, f2",
  autoroute:"AutoRoute command. Limits: outer 2 layers, through vias, ignores keep-outs, no differential-pair rules",
  route:"Route tool (walk-around / push / block)",
  zone:"Zones / copper pour; ui-evidence e5, c4",
  library:"LibraryDock.tsx, parts_search (src-tauri/src/parts.rs), catalogue (ADR-0032); ui-evidence d1",
  distributor:"Distributor search is not configured on main (distributor.invalid): no live stock or price",
  bom:"BOM table + CSV/XLSX export (shell/bomConfig.ts: Stock and Unit price are 'stored record' fields); ui-evidence d3",
  outputs:"Gerber / drill / CPL / BOM / PDF to output/rev-N; ui-evidence d2, d3, e9",
  release:"ReleaseCheckDialog.tsx + release_check; UNKNOWN blocks release (ADR-0048); ui-evidence e7",
  fabprep:"fabricator_prepare (eak-harness): result is 'prepared for review', never 'manufacturing-ready'",
  props:"Inspector / Properties (shell/inspectorModel.ts: Designator, Value, Footprint, Manufacturer / MPN)",
  log:"Every Command is journalled with actor and revision (eak-runtime journal, get_history)",
  tasks:"Agent task ledger (agent-tasks.json, ADR-0036) and its status-bar summary (Workspace.tsx)",
  undo:"Engine undo / redo: one shared stack; a Batch is one step (eak-runtime/src/engine.rs)",
  ckptEngine:"Engine::create_checkpoint / list_checkpoints / restore_checkpoint exist (eak-runtime/src/engine.rs); nothing in the app calls them yet",
  terminal:"Terminal workspace on its own PTY engine (crates/eak-terminal, ADR-0019; TerminalWorkspace.tsx): spaces, tabs, split, details panel",
  detect:"Agent detection from the foreground program name (eak-terminal KNOWN_AGENTS + terminal-agents.json). macOS reports no agent today (proc_info.rs)",

const has = (s,ref)=>s.parts.some(p=>p.ref===ref);
function runErc(s){
  const f=[];
  if(!s.pwrFlag) f.push({sev:"error",obj:"U1",where:"schematic",msg:"Net +3V3: power input pins (U1, U3, U4) but no power output or power flag drives it",fix:"erc"});
  if(!s.enRC) f.push({sev:"error",obj:"U1",where:"schematic",msg:"U1 pin EN (input) is not connected",fix:"erc"});
  if(!s.pgNC) f.push({sev:"warning",obj:"U2",where:"schematic",msg:"U2 pin PG (open-drain output) is not connected",fix:"erc"});
  return f;
}
function aiNotes(s){
  return has(s,"R1")?[]:[{sev:"note",obj:"U3",where:"schematic",msg:"I2C_SDA / I2C_SCL have no pull-up resistors. SHT40 datasheet: external pull-ups are required",label:"datasheet_supported",fix:"pullups"}];
}
function pcbInSync(s){ return s.parts.map(p=>p.ref).sort().join()===[...s.pcbParts].sort().join() && s.syncRev>=s.schemRev; }
function runDrc(s){
  const f=[];
  const unplaced=s.pcbParts.filter(r=>!s.placed.includes(r));
  if(!pcbInSync(s)) f.push({sev:"warning",obj:null,where:"pcb",msg:"PCB is out of date with the schematic. Run Update PCB",fix:null});
  if(unplaced.length) f.push({sev:"error",obj:unplaced[0],where:"pcb",msg:`${unplaced.length} footprint(s) outside the board outline: ${unplaced.join(", ")}`,fix:null});
  if(s.routed==="partial") f.push({sev:"error",obj:"U1",where:"pcb",msg:"11 connections unrouted",fix:null});
  if(s.routed==="auto") f.push({sev:"error",obj:"J2",where:"pcb",msg:"2 connections unrouted: USB_D+ / USB_D- (the autorouter has no differential-pair rules)",fix:null});
  if(s.routed!=="partial" && !s.clearFix) f.push({sev:"error",obj:"J1",where:"pcb",msg:"Clearance 0.12 mm < 0.15 mm: track +12V_IN to the GND pad of J1",fix:"clear"});
  if(!s.currents) f.push({sev:"unknown",obj:null,where:"pcb",msg:"Track width vs current: UNKNOWN. No current declared for +12V_IN and +3V3",fix:"currents"});
  return f;
}

function releaseCheck(s){
  const items=[];
  const e=s.erc&&s.erc.rev>=s.schemRev?counts(s.erc.findings):null;
  items.push(e?(e.e?{st:"FAIL",name:"ERC",why:`${e.e} error(s)`}:{st:"PASS",name:"ERC",why:"0 errors at r"+s.erc.rev}):{st:"UNKNOWN",name:"ERC",why:"Not run on the current schematic"});
  const d=s.drc&&s.drc.rev===s.rev?counts(s.drc.findings):null;
  items.push(d?(d.e?{st:"FAIL",name:"DRC",why:`${d.e} error(s)`}:d.u?{st:"UNKNOWN",name:"DRC",why:`${d.u} rule(s) UNKNOWN (missing inputs)`}:{st:"PASS",name:"DRC",why:"0 errors, 0 unknown at r"+s.drc.rev}):{st:"UNKNOWN",name:"DRC",why:"Not run on the current board"});
  items.push(pcbInSync(s)?{st:"PASS",name:"Schematic and PCB",why:"In sync"}:{st:"FAIL",name:"Schematic and PCB",why:"PCB out of date"});
  items.push(s.outputsRev===s.rev?{st:"PASS",name:"Outputs",why:"Generated for r"+s.rev}:{st:"FAIL",name:"Outputs",why:s.outputsRev?`Generated for r${s.outputsRev}, board is r${s.rev}`:"Not generated"});
  items.push({st:"PASS",name:"BOM: every line has an MPN",why:bomRows(s).length+" lines"});

}

function go(ws,o={}){ S.ws=ws; if(ws!=="home") S.opened=true; Object.assign(S,o); render(); }

function render(){
  document.querySelectorAll(".screen").forEach(e=>e.classList.toggle("on",e.id===S.ws));
  document.querySelectorAll(".wsbtn").forEach(b=>b.classList.toggle("on",b.dataset.arg===S.ws));

  if(S.ws==="settings") renderSettings();
  renderStatus(); renderStory();
}

  const c=document.getElementById("canvas");

function partSvg(p){
  const nw=S.proposal&&S.proposal.preview&&S.proposal.newRefs.includes(p.ref);
  return `<g class="sym ${S.sel===p.ref?"sel":""} ${S.flash===p.ref?"flash":""} ${nw?"new":""}" data-act="select" data-arg="${p.ref}"><rect class="body" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="3"/><text class="ref" x="${p.x+4}" y="${p.y+13}">${p.ref}</text><text class="val" x="${p.x+4}" y="${p.y+26}">${esc(p.val)}</text></g>`;
}
function schematicSvg(){
  const view = S.proposal&&S.proposal.preview ? S.proposal.copy : S;
  const P=Object.fromEntries(view.parts.map(p=>[p.ref,p]));
  const w=(a,b,c,d)=>`<path class="wire" d="M${a} ${b} L${c} ${d}"/>`;
  const wires=w(100,82,150,83)+w(196,83,300,83)+w(100,230,140,228)+w(200,228,240,193)+w(286,193,300,110)+w(390,75,420,75)+w(470,75,505,75)+w(505,75,505,105)+w(505,75,560,170)+w(690,175,770,175)+w(690,265,770,265)+w(265,110,265,90)+w(315,150,315,125);
  const labels=`<text class="net" x="210" y="78">VIN_OR</text><text class="net" x="520" y="70">+3V3</text><text class="net" x="700" y="170">I2C_SDA/SCL</text><text class="net" x="700" y="260">I2C</text><text class="net" x="104" y="78">+12V_IN</text><text class="net" x="104" y="224">VBUS</text><text class="net" x="200" y="246">USB_D±</text>`;
  let extras="";
  if(view.pwrFlag) extras+=`<path class="wire" d="M540 75 L540 50"/><polygon points="532,50 548,50 540,38" fill="none" stroke="var(--ok)"/><text class="net" x="550" y="46">PWR_FLAG</text>`;
  if(view.pgNC) extras+=`<text x="392" y="112" fill="var(--fg-dim)" font-size="14">✕</text><text class="val" x="404" y="112">PG no-connect</text>`;
  const ercF = ercCurrent()?S.erc.findings:[];
  const marks = ercF.filter(f=>f.obj&&P[f.obj]).map((f,i)=>{const p=P[f.obj]; return `<circle cx="${p.x+p.w-i*14}" cy="${p.y}" r="7" fill="${f.sev==="error"?"var(--err)":"var(--warn)"}"/><text x="${p.x+p.w-3-i*14}" y="${p.y+4}" font-size="10" fill="#000">!</text>`}).join("");
  const sheet=`<rect x="10" y="10" width="880" height="320" fill="none" stroke="#2a313a"/><text x="16" y="324" fill="#4a5462" font-size="10">Sheets Power · MCU · Sensors, shown on one page in this demo</text>`;
  const note = S.proposal&&S.proposal.preview?`<div class="overlay-note proposed-zone">Previewing the proposal on a copy. Dashed parts are new. Nothing is applied yet. ${pr("proposal")}</div>`:"";
  const ercChip = S.erc?(ercCurrent()?`<span class="chip ${counts(S.erc.findings).e?"err":"ok"}">ERC r${S.erc.rev}: ${counts(S.erc.findings).e} errors, ${counts(S.erc.findings).w} warnings</span>`:`<span class="chip unk">ERC stale (r${S.erc.rev})</span>`):`<span class="chip unk">ERC not run</span>`;
  return `<svg viewBox="0 0 900 340" preserveAspectRatio="xMidYMid meet">${sheet}${wires}${labels}${extras}${view.parts.map(partSvg).join("")}${marks}</svg>${note}
   <div class="ins"><span class="chip">${view.parts.length} symbols</span>${ercChip}</div>`;
}
function pcbSvg(){
  const sc=12, ox=40, oy=20;
  const fps=S.pcbParts.map((r,i)=>{const [x,y,w,h]=PCBPOS[r]||[0,0,3,2]; const placed=S.placed.includes(r);
    const X=placed?ox+x*sc:ox+61*sc+(i%2)*40, Y=placed?oy+y*sc:oy+(i%10)*40; return {r,X,Y,W:w*sc,H:h*sc,placed}});
  const F=Object.fromEntries(fps.map(f=>[f.r,f]));
  const cx=f=>f.X+f.W/2, cy=f=>f.Y+f.H/2;
  const pairs=[["J1","D1"],["D1","U2"],["J2","U5"],["U5","D2"],["D2","U2"],["U2","L1"],["L1","C2"],["C2","U1"],["U1","U3"],["U1","U4"],["C1","U2"],["C5","U2"],["R1","U3"],["R2","U4"],["R3","U1"],["C7","U1"]].filter(([a,b])=>F[a]&&F[b]);
  let tracks="",rats="";
  for(const [a,b] of pairs){const A=F[a],B=F[b]; const usb=(a==="J2"&&b==="U5");
    const routed=S.routed==="done"||(S.routed==="auto"&&!usb)||(S.routed==="partial"&&["J1-D1","D1-U2","U2-L1"].includes(a+"-"+b));
    if(routed&&A.placed&&B.placed) tracks+=`<path class="track ${usb?"b":""}" d="M${cx(A)} ${cy(A)} L${cx(A)} ${cy(B)} L${cx(B)} ${cy(B)}"/>`; else rats+=`<line class="rats" x1="${cx(A)}" y1="${cy(A)}" x2="${cx(B)}" y2="${cy(B)}"/>`;}
  const pour=S.pour?`<rect x="${ox+2}" y="${oy+2}" width="${60*sc-4}" height="${42*sc-4}" fill="rgba(79,129,189,.16)" stroke="rgba(79,129,189,.5)" stroke-dasharray="4 3"/>`:"";
  const clr=(!S.clearFix&&S.routed!=="partial")?`<circle cx="${ox+15*sc}" cy="${oy+8*sc}" r="10" fill="none" stroke="var(--err)" stroke-width="2"/>`:"";
  const body=fps.map(f=>`<g class="fp ${S.sel===f.r?"sel":""} ${S.flash===f.r?"flash":""}" data-act="select" data-arg="${f.r}"><rect class="body" x="${f.X}" y="${f.Y}" width="${f.W}" height="${f.H}" rx="2"/><text class="ref" x="${f.X+3}" y="${f.Y+12}" font-size="10">${f.r}</text></g>`).join("");
  const dc=S.drc&&drcCurrent()?counts(S.drc.findings):null;
  return `<svg viewBox="0 0 900 560" preserveAspectRatio="xMidYMid meet"><rect x="${ox}" y="${oy}" width="${60*sc}" height="${42*sc}" fill="#0f2416" stroke="#e8c35a" stroke-width="1.5"/>${pour}${tracks}${rats}${body}${clr}
   <text x="${ox}" y="${oy+42*sc+16}" fill="var(--fg-faint)" font-size="11">Board 60 × 42 mm, 2 layers. Dashed blue lines are unrouted connections; parts right of the board are not placed yet.</text></svg>
   <div class="ins">${pcbInSync(S)?`<span class="chip ok">In sync with the schematic</span>`:`<span class="chip warn">PCB out of date: run Update PCB</span>`}<span class="chip">${S.routed==="done"?"All routed":S.routed==="auto"?"2 connections left":"11 unrouted"}</span>${S.drc?(dc?`<span class="chip ${dc.e?"err":dc.u?"unk":"ok"}">DRC r${S.drc.rev}: ${dc.e} errors, ${dc.u} unknown</span>`:`<span class="chip unk">DRC stale</span>`):`<span class="chip unk">DRC not run</span>`}</div>
   ${S.routed==="auto"?`<div class="overlay-note">Auto-route limits on main: outer 2 layers, through vias, keep-outs ignored, no differential-pair rules. So USB_D± are left for hand routing. ${ex("autoroute")}</div>`:""}`;
}
function view3d(){
  S.viewed3d=true;
  const rot={iso:"rotateX(58deg) rotateZ(-32deg)",top:"rotateX(0deg)",side:"rotateX(84deg)"}[S.view3d];
  const lim=+S.brief.enclosure;
  const colors={J1:"#333",J2:"#999",U1:"#556",U2:"#222",L1:"#444",U3:"#2a2a2a",U4:"#3a3a3a"};
  const cmps=S.show3dParts?S.pcbParts.filter(r=>S.placed.includes(r)).map(r=>{const [x,y,w,h]=PCBPOS[r]; const p=S.parts.find(q=>q.ref===r)||{h3d:1}; const tall=p.h3d>lim-1.5;
    return `<div class="cmp ${tall?"tall":""}" style="left:${x/60*400}px;top:${y/42*280}px;width:${Math.max(w/60*400,8)}px;height:${Math.max(h/42*280,6)}px;transform:translateZ(${p.h3d*4}px)"><div class="top" style="background:${colors[r]||"#7a5"}">${r}${S.measure?`<br>${p.h3d} mm`:""}</div></div>`}).join(""):"";
  const tallest=S.parts.reduce((a,p)=>p.h3d>a.h3d?p:a,{h3d:0,ref:"-"});
  return `<div id="v3d"><div id="board3d" style="transform:${rot}"><div class="pcb"></div>${cmps}</div></div>
  <div class="ins"><button data-act="v3d" data-arg="iso" class="${S.view3d==="iso"?"primary":""}">Iso</button><button data-act="v3d" data-arg="top" class="${S.view3d==="top"?"primary":""}">Top</button><button data-act="v3d" data-arg="side" class="${S.view3d==="side"?"primary":""}">Side</button>
   <button data-act="v3dParts">${S.show3dParts?"Hide":"Show"} components</button><button data-act="v3dMeasure" class="${S.measure?"primary":""}">Measure heights</button></div>
  <div class="overlay-note">Tallest part: <b>${tallest.ref}</b> ${tallest.h3d} mm against the enclosure limit of ${lim} mm (from the brief): <span class="chip ${tallest.h3d<lim?"ok":"err"}">${tallest.h3d<lim?(lim-tallest.h3d).toFixed(1)+" mm margin":"too tall"}</span><br><span class="faint">The real viewer today: no collision check, no STEP export, arcs and cut-outs ignored.</span> ${ex("v3d")}</div>`;
}

const TOOLS={claude:{label:"Claude Code",bin:"claude"},codex:{label:"Codex",bin:"codex"},gemini:{label:"Gemini CLI",bin:"gemini"},opencode:{label:"OpenCode",bin:"opencode"}};
function toolReady(){ for(const [k,t] of Object.entries(S.tools)) if(t.conn&&t.signed) return TOOLS[k].label; if(S.modelKeys.anthropic||S.modelKeys.openai) return "Direct model key"; return null; }
function copilotHtml(){
  const tool=toolReady();
  let h=`<div class="proposed-zone" style="padding:6px;border-radius:6px;display:flex;flex-direction:column;gap:8px;min-height:100%">
   <div class="row"><span class="caps">AI co-pilot</span>${pr("copilot")}</div>`;
  if(!tool){
    return h+`<div class="bubble">No AI tool connected yet. The co-pilot uses a tool you already have (Claude Code, Codex…) or a direct model key.<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="primary" data-act="go" data-arg="settings:aitools">Connect an AI tool</button><button data-act="go" data-arg="settings:models">Use a model key</button></div></div>
     <div class="faint" style="font-size:var(--fs-xs)">Without AI, everything else in EAK works the same.</div></div>`;
  }
  h+=`<div class="row" style="font-size:var(--fs-xs);flex-wrap:wrap"><span class="chip ok">${tool}</span><span class="grow"></span><select data-act-change="perm" aria-label="AI change policy"><option value="ask" ${S.permMode==="ask"?"selected":""}>Ask before every change</option><option value="auto" ${S.permMode==="auto"?"selected":""}>Auto-apply reversible layout tweaks</option></select></div>
   <div id="chatLog" class="col" style="flex:1;overflow:auto;min-height:120px">`;
  if(!S.chat.length) h+=`<div class="faint" style="font-size:var(--fs-sm)">Ask in plain words. The co-pilot reads the brief and Problems through EAK's tools, then proposes a change for you to review. It cannot apply anything by itself, and it never marks its own work as passing: EAK re-runs the checks.</div>`;
  for(const m of S.chat){
    if(m.who==="me") h+=`<div class="bubble me">${esc(m.text)}</div>`;
    else if(m.kind==="q") h+=`<div class="bubble"><div>${esc(m.text)}</div>${m.answered?`<div class="chip info" style="margin-top:4px;height:auto;white-space:normal">You chose: ${esc(m.answered)}</div>`:m.opts.map((o,i)=>`<button class="qopt" data-act="answer" data-arg="${i}">${esc(o)}</button>`).join("")}</div>`;
    else if(m.kind==="plan") h+=`<div class="bubble"><div class="caps">Plan</div><ol class="plan" style="padding-left:18px;margin:4px 0">${m.steps.map((s,i)=>`<li class="${i<m.done?"done":i===m.done&&S.copilotBusy?"run":""}">${esc(s)}</li>`).join("")}</ol></div>`;
    else if(m.kind==="prop") h+=`<div class="bubble" style="border-color:var(--proposed)"><div class="row"><b>Proposal</b><span class="grow"></span>${m.state==="applied"?`<span class="chip ok">Applied r${m.rev}</span>`:m.state==="discarded"?`<span class="chip">Discarded</span>`:`<span class="chip info">Waiting for you</span>`}</div><div class="dim">${esc(m.text)}</div>${m.state==="open"?`<div class="row" style="margin-top:6px;flex-wrap:wrap"><button class="primary" data-act="reviewProposal">Review…</button><button data-act="previewProposal">${S.proposal&&S.proposal.preview?"Hide preview":"Preview on canvas"}</button></div>`:""}</div>`;
    else h+=`<div class="bubble">${esc(m.text)}</div>`;
  }
  if(S.copilotBusy) h+=`<div class="row"><span class="chip info">Working…</span><button data-act="stopAi">Stop</button></div>`;
  h+=`</div><div class="row" style="flex-wrap:wrap;gap:4px">${[["Fix the ERC errors","erc"],["Add I2C pull-ups","pullups"],["Declare rail currents from the brief","currents"],["Fix the DRC clearance","clear"]].map(([l,k])=>`<button style="font-size:var(--fs-xs);height:22px" data-act="aiAsk" data-arg="${k}">${l}</button>`).join("")}</div>
   <div class="row"><input id="chatIn" class="grow" placeholder="Ask about this board…" aria-label="Ask the co-pilot"><button data-act="aiSend">Send</button></div></div>`;
  return h;
}

function allProblems(){
  const out=[];
  out.push(...(S.erc?S.erc.findings.map(f=>({...f,src:"ERC",stale:!ercCurrent()})):[{sev:"unknown",obj:null,where:"schematic",msg:"ERC has not been run",src:"ERC",fix:null}]));
  out.push(...(S.drc?S.drc.findings.map(f=>({...f,src:"DRC",stale:!drcCurrent()})):[{sev:"unknown",obj:null,where:"pcb",msg:"DRC has not been run",src:"DRC",fix:null}]));
  out.push(...aiNotes(S).map(f=>({...f,src:"Review note"})));
  if(S.release&&S.release.rev===S.rev) for(const i of S.release.items) if(i.st!=="PASS") out.push({sev:i.st==="FAIL"?"error":"unknown",obj:null,where:"release",msg:`Release: ${i.name}: ${i.why}`,src:"Release"});
  for(const t of S.aiTasks) if(!["completed","discarded","stopped"].includes(t.status)) out.push({sev:"warning",obj:null,where:"copilot",msg:`AI task '${t.name}': ${t.status}`,src:"AI task"});
  return out;
}

function termRun(cmd){
  const tab=curTab(); const c=cmd.trim(); let o="";
  const line=PROMPT()+esc(cmd)+"\n";
  if(tab.agent){
    if(c==="/exit"||c==="exit"){ o=`<span class="faint">(${tab.agent} exited)</span>\n`; tab.agent=null; tab.status="idle"; }
    else if(c){ o=`<span style="color:var(--proposed)">${tab.agent}</span>: (demo) the agent would call EAK's tools through eak-mcp here. Its edits go through the engine and appear in the EDA window at the next revision.\n`; tab.status="waiting"; }
  } else if(c==="help"){ o="Demo commands: eak status, eak erc, eak drc, claude, codex, ls, clear\n"; }
  else if(c==="clear"){ tab.out=""; renderTerm(); document.getElementById("termIn").focus(); return; }
  else if(c==="ls"){ o="checkpoints/  design-flow/  evidence/  output/  pcb/  schematic/  esp32s3-env-sensor.eak\n"; }
  else if(c==="eak status"){ const k=counts(allProblems()); const n=nextStage(); o=`project  ${esc(S.project)}\nrevision r${S.rev}\nproblems ${k.e} error, ${k.w} warning, ${k.u} unknown\nnext     ${n?n.name:"-"}\n`; }
  else if(c==="eak erc"){ record("RunErc (eak CLI)","external-agent",s=>{s.erc={rev:s.rev,findings:runErc(s)}}); const k=counts(S.erc.findings); o=`ERC r${S.rev}: ${k.e} error(s), ${k.w} warning(s). The EDA window refreshed.\n`; }
  else if(c==="eak drc"){ record("RunDrc (eak CLI)","external-agent",s=>{s.drc={rev:s.rev,findings:runDrc(s)}}); const k=counts(S.drc.findings); o=`DRC r${S.rev}: ${k.e} error(s), ${k.u} UNKNOWN (not passing).\n`; }
  else if(c==="claude"||c==="codex"){ tab.agent=c; tab.status="running"; o=`<span style="color:var(--proposed)">${c}</span> started (demo). EAK detected the agent from the program name; the tab and the Agents list now show it.\n<span class="faint">One-time setup today, typed by hand: claude mcp add eak -- eak mcp\nProposed: Settings › AI tools › Connect does this for you.</span>\nType a request, or /exit.\n`; }
  else if(c) o=`${esc(c.split(" ")[0])}: command not found in this demo (try help)\n`;
  tab.out=(tab.out||"")+line+o; renderTerm(); const i=document.getElementById("termIn"); if(i) i.focus();
}

const RECIPES={
  erc:{name:"Fix the ERC errors",ask:"Fix the ERC errors",q:["U1 EN needs a reset delay. Which values?",["10 kΩ pull-up + 1 µF to GND (module datasheet values)","Leave EN to me, fix only the power flag and PG"]],
    plan:["Read the ERC findings and the ESP32-S3 module note on EN","Add a power flag on +3V3 (the buck output drives it)","Add R3 10 kΩ to +3V3 and C7 1 µF to GND on EN","Mark U2 PG as no-connect","Re-run ERC on the copy"],
    build:(c,ans)=>{c.pwrFlag=true;c.pgNC=true; if(ans===0){c.enRC=true; c.parts.push({ref:"R3",mpn:"RC0402FR-0710KL",val:"10 kΩ",x:560,y:296,w:36,h:24,h3d:0.35},{ref:"C7",mpn:"GRM155R61A105KE15D",val:"1 µF",x:610,y:296,w:36,h:24,h3d:0.5});}},
    rows:ans=>[["Add","Power flag on +3V3","schematic"],...(ans===0?[["Add","R3 10 kΩ RC0402FR-0710KL, EN to +3V3","part"],["Add","C7 1 µF GRM155R61A105KE15D, EN to GND","part"]]:[]),["Set","U2 PG: no-connect marker","schematic"]],
    labels:["passed_deterministic_checks (ERC re-run by EAK)","datasheet_supported (EN RC values)"],schem:true},
  pullups:{name:"Add I2C pull-ups",ask:"Add I2C pull-ups",q:["Pull-up value for the I2C bus with 2 sensors?",["4.7 kΩ, 100 kHz bus","2.2 kΩ, 400 kHz bus"]],
    plan:["Check the SHT40 and BME280 I2C requirements","Add R1 / R2 pull-ups to +3V3 on SDA / SCL","Re-run ERC on the copy"],
    build:(c,ans)=>{const m=ans===0?"RC0402FR-074K7L":"RC0402FR-072K2L", v=ans===0?"4.7 kΩ":"2.2 kΩ"; c.parts.push({ref:"R1",mpn:m,val:v,x:700,y:110,w:36,h:24,h3d:0.35},{ref:"R2",mpn:m,val:v,x:745,y:110,w:36,h:24,h3d:0.35});},
    rows:ans=>[["Add",`R1 ${ans===0?"4.7 kΩ RC0402FR-074K7L":"2.2 kΩ RC0402FR-072K2L"}, I2C_SDA to +3V3`,"part"],["Add",`R2 ${ans===0?"4.7 kΩ RC0402FR-074K7L":"2.2 kΩ RC0402FR-072K2L"}, I2C_SCL to +3V3`,"part"]],
    labels:["datasheet_supported (SHT40: external pull-ups required)","assumed (bus speed you chose)"],schem:true},
  currents:{name:"Declare rail currents",ask:"Declare rail currents from the brief",q:["The brief has no currents. Estimate them from the parts?",["Yes: +3V3 0.6 A (ESP32-S3 Wi-Fi peaks), +12V_IN 0.25 A","No, I'll type them in the brief myself"]],
    plan:["Read the brief and the part datasheets","Estimate peak current per rail","SetNetCurrent on +12V_IN and +3V3","Re-run DRC on the copy"],
    build:(c,ans)=>{if(ans===0){c.currents=true;c.brief.rails[0].i="0.25";c.brief.rails[1].i="0.6";}},
    rows:ans=>ans===0?[["Set","+12V_IN current 0.25 A (SetNetCurrent)","rule input"],["Set","+3V3 current 0.6 A (SetNetCurrent)","rule input"]]:[],
    labels:["assumed (estimate: please confirm)","datasheet_supported (ESP32-S3 RF peak current)"],schem:false},
  clear:{name:"Fix the DRC clearance",ask:"Fix the DRC clearance",q:["Move the +12V_IN track or the GND via?",["Move the +12V_IN track 0.2 mm away","Move the GND via instead"]],
    plan:["Read the DRC finding at J1","Move the track segment","Re-run DRC on the copy"],
    build:c=>{c.clearFix=true;}, rows:ans=>[["Move",ans===0?"Track +12V_IN segment near J1 (0.12 → 0.21 mm)":"GND via near J1 (0.12 → 0.20 mm)","pcb"]], labels:["passed_deterministic_checks (DRC re-run by EAK)"],schem:false, reversible:true},
};
let aiTimer=null;
const lastTask=()=>S.aiTasks[S.aiTasks.length-1];
function aiStart(key, text){
  if(!toolReady()){ go("eda",{rtab:"copilot"}); toast("Connect an AI tool first: Settings › AI tools."); return; }
  if(S.copilotBusy) return toast("The co-pilot is working. Stop it first.");
  if(S.proposal) return toast("Review or discard the open proposal first.");
  const r=RECIPES[key]; S.ws="eda"; S.rtab="copilot";
  if(!r){ S.chat.push({who:"me",text},{who:"ai",text:"(demo) This demo answers the four suggestions below. In the real flow the co-pilot reads the brief and Problems through EAK's tools and proposes a change."}); render(); return; }
  if(key==="clear"&&(S.routed==="partial"||S.clearFix)){ S.chat.push({who:"me",text:text||r.ask},{who:"ai",text:"There is no clearance finding to fix right now. Route the board and run DRC first."}); render(); return; }
  S.chat.push({who:"me",text:text||r.ask},{who:"ai",kind:"q",text:r.q[0],opts:r.q[1],key});
  S.aiTasks.push({name:r.name,tool:toolReady(),phase:"planning",status:"waiting for you"});
  render();
}
function aiAnswer(i){
  const q=[...S.chat].reverse().find(m=>m.kind==="q"&&!m.answered); if(!q) return;
  q.answered=q.opts[i]; const r=RECIPES[q.key];
  const plan={who:"ai",kind:"plan",steps:r.plan,done:0}; S.chat.push(plan);
  const task=lastTask(); task.phase="working"; task.status="running";
  S.copilotBusy=true; render();
  const step=()=>{ plan.done++; if(plan.done<r.plan.length){ render(); aiTimer=setTimeout(step,420); return; }
    S.copilotBusy=false; buildProposal(q.key,i); render(); };
  aiTimer=setTimeout(step,420);
}
function stopAi(){ clearTimeout(aiTimer); S.copilotBusy=false; const t=lastTask(); if(t){t.status="stopped";t.phase="partial"} S.chat.push({who:"ai",text:"Stopped. Nothing was changed in the project."}); render(); }
function buildProposal(key,ans){
  const r=RECIPES[key]; const t=lastTask();
  const before=snap(); const copy=snap();
  r.build(copy,ans);
  const rows=r.rows(ans).map(x=>({op:x[0],what:x[1],kind:x[2],on:true}));
  if(!rows.length){ S.chat.push({who:"ai",text:"OK, nothing to change. Open Brief in the left bar to type the currents."}); t.status="completed"; t.phase="completed"; return; }
  const eb=counts(runErc(before)), ea=counts(runErc(copy)), db=counts(runDrc(before)), da=counts(runDrc(copy));
  const had=new Set(S.parts.map(p=>p.ref));
  S.proposal={key,ans,copy,rows,baseRev:S.rev,labels:r.labels,delta:{eb,ea,db,da},newRefs:copy.parts.filter(p=>!had.has(p.ref)).map(p=>p.ref),preview:false,schem:r.schem};
  t.phase="proposal_ready"; t.status="waiting for review";
  if(S.permMode==="auto"&&r.reversible){ applyProposal(true); return; }
  S.chat.push({who:"ai",kind:"prop",text:`${rows.length} change(s). EAK re-ran the checks on a copy: ERC errors ${eb.e} → ${ea.e}, DRC errors ${db.e} → ${da.e}, DRC unknown ${db.u} → ${da.u}. Not self-checked.`,state:"open"});
}
function reviewDialog(){
  const P=S.proposal; if(!P) return;
  const stale=P.baseRev!==S.rev;
  modal(`<div class="row" style="flex-wrap:wrap"><h2>Review proposed change</h2>${pr("proposal")}${ex("eco")}</div>
  <div class="dim">From the co-pilot (${toolReady()}). Built on a copy of r${P.baseRev}; nothing in your project has changed yet.</div>
  ${stale?`<div><span class="chip err">The project changed (now r${S.rev}). Apply is refused: ask the co-pilot to re-plan.</span></div>`:""}
  <table><thead><tr><th>Keep</th><th>Change</th><th>What</th><th>Kind</th></tr></thead><tbody>${P.rows.map((r,i)=>`<tr><td><input type="checkbox" data-act-change="propRow" data-arg="${i}" ${r.on?"checked":""} style="height:auto" aria-label="Keep this change"></td><td>${r.op}</td><td>${esc(r.what)}</td><td class="faint">${r.kind}</td></tr>`).join("")}</tbody></table>
  <div class="row" style="flex-wrap:wrap"><span class="caps">Checks re-run by EAK on the copy</span>
   <span class="chip ${P.delta.ea.e<P.delta.eb.e?"ok":""}">ERC errors ${P.delta.eb.e} → ${P.delta.ea.e}</span><span class="chip">ERC warnings ${P.delta.eb.w} → ${P.delta.ea.w}</span><span class="chip ${P.delta.da.e<P.delta.db.e?"ok":""}">DRC errors ${P.delta.db.e} → ${P.delta.da.e}</span><span class="chip ${P.delta.da.u<P.delta.db.u?"ok":"unk"}">DRC unknown ${P.delta.db.u} → ${P.delta.da.u}</span></div>
  <div class="row" style="flex-wrap:wrap"><span class="caps">Evidence labels</span>${P.labels.map(l=>`<span class="chip">${esc(l)}</span>`).join("")}${ex("evidence")}</div>
  <div class="faint" style="font-size:var(--fs-xs)">Apply saves a checkpoint, then applies the change as one revision (one undo step) at r${P.baseRev}. In this demo a proposal is applied whole: untick a row and Apply is disabled until you tick it again or Discard.</div>
  <div class="row"><button data-act="exportProposal">Export report</button><span class="grow"></span><button data-act="discardProposal">Discard</button><button class="primary" data-act="applyProposal" ${stale||!P.rows.every(r=>r.on)?"disabled":""}>Apply</button></div>`);
}
function applyProposal(auto){
  const P=S.proposal; if(!P) return;
  if(P.baseRev!==S.rev){ toast("Refused: the project changed since the proposal was made."); return; }
  const r=RECIPES[P.key];
  S.checkpoints.push({name:"Before AI: "+r.name,rev:S.rev});
  const actor="agent:"+(toolReady()||"assistant").toLowerCase().replace(/ /g,"-")+(auto?" (auto, reversible)":" (applied by you)");
  execute(`Batch: ${r.name} (${P.rows.length} changes)`,actor,s=>{ for(const k of ["parts","pwrFlag","enRC","pgNC","currents","brief","clearFix"]) s[k]=clone(P.copy[k]); },{schem:P.schem});
  const m=[...S.chat].reverse().find(x=>x.kind==="prop"&&x.state==="open");
  if(m){m.state="applied";m.rev=S.rev} else S.chat.push({who:"ai",kind:"prop",text:"Auto-applied a reversible layout tweak (your setting).",state:"applied",rev:S.rev});
  const t=lastTask(); if(t){t.phase="completed";t.status="completed"}
  S.chat.push({who:"ai",text:`Applied as r${S.rev}, with a checkpoint saved first. Undo takes the whole change back. ${P.schem?"Re-run ERC to confirm; the PCB is now out of date.":"Re-run DRC to confirm."}`});
  S.proposal=null; closeModal(); render(); toast(auto?"Auto-applied (reversible, your setting). Undo is one step.":"Applied as one change: r"+S.rev);
}
function discardProposal(){ const m=[...S.chat].reverse().find(x=>x.kind==="prop"&&x.state==="open"); if(m)m.state="discarded"; const t=lastTask(); if(t){t.status="discarded";t.phase="discarded"} S.proposal=null; closeModal(); render(); toast("Discarded. Nothing changed."); }

function ecoDialog(){
  const head=`<div class="row"><h2>Update PCB</h2>${ex("eco")}</div>`;

  const e=counts(S.erc.findings).e;
  if(e){ modal(`${head}<div><span class="chip err">Blocked by the ERC gate: ${e} ERC error(s) on the current schematic</span></div><div class="dim">Fix the errors (or ask the co-pilot to propose fixes), re-run ERC, then update the PCB.</div><div class="row"><span class="grow"></span><button data-act="closeModal">Close</button><button class="primary" data-act="ecoToProblems">Show Problems</button></div>`); return; }
  const add=S.parts.map(p=>p.ref).filter(r=>!S.pcbParts.includes(r)); const rem=S.pcbParts.filter(r=>!has(S,r));
  const rows=[...add.map(r=>({t:"Add footprint",o:r,d:cat(S.parts.find(p=>p.ref===r).mpn).fp})),...rem.map(r=>({t:"Remove footprint",o:r,d:""})),...(S.schemRev>S.syncRev?[{t:"Update connections",o:"nets",d:"from schematic r"+S.schemRev}]:[])];
  if(!rows.length){ modal(`${head}<div><span class="chip ok">The PCB is already in sync with the schematic</span></div><div class="row"><span class="grow"></span><button class="primary" data-act="closeModal">Close</button></div>`); return; }
  modal(`<div class="row"><h2>Update PCB: change preview</h2>${ex("eco")}</div><div class="dim">Computed on a copy of the project. Nothing changes until Apply, which applies everything as one change at r${S.rev}.</div>

   <div class="faint" style="font-size:var(--fs-xs)">In EAK each row has a checkbox for a partial update; this demo applies all rows.</div>
   <div class="row"><button data-act="toast" data-arg="Report saved to evidence/eco-r${String(S.rev).padStart(6,"0")}.json (demo)">Export report</button><span class="grow"></span><button data-act="closeModal">Cancel</button><button class="primary" data-act="ecoApply">Apply ${rows.length} change(s)</button></div>`);
}

const TOUR=[

    if(toolReady()){ go("eda",{side:"brief",rtab:"copilot"}); S.chat.push({who:"me",text:t},{who:"ai",text:"I put your goal into the brief (left). Two numbers are missing: the rail currents. Use 'Declare rail currents from the brief', or type them in."}); render(); }
    else { go("eda",{side:"brief"}); toast("Opened with a brief from your words (the demo uses the sample project). Connect an AI tool to get proposals."); } },
  newProject(){ modal(`<div class="row"><h2>New project</h2>${ex("newproj")}</div><label class="col"><span class="caps">Name</span><input id="npName" value="my-sensor-board"></label><label class="col"><span class="caps">Folder</span><input id="npDir" value="~/eak-projects"></label><label class="col"><span class="caps">Template</span><select id="npTpl"><option>Blank 2-layer board</option><option>From the sample: ESP32-S3 sensor</option></select></label><div class="row"><span class="grow"></span><button data-act="closeModal">Cancel</button><button class="primary" data-act="createProject">Create</button></div>`); },
  createProject(){ const n=(document.getElementById("npName").value||"").trim()||"my-sensor-board"; closeModal(); S.project=n; go("eda",{side:"brief"}); toast(`Created '${n}'. The demo fills it with the sample design so the rest of the journey can be shown.`); },
  openSample(){ go("eda",{side:"overview",editor:"schematic"}); if(S.firstRun) tour(0); },
  importKicad(){ go("eda"); toast("In EAK: File › Import KiCad project. This page has no file access, so it opens the sample design."); },
  continue(){ const n=nextStage(); if(n) n.go(); else go("eda"); toast("Continuing at: "+(n?n.n+" · "+n.name:"the workspace")); },
  stage(a){ STAGES[+a-1].go(); },
  side(a){ S.side=a; render(); }, editor(a){ S.editor=a; render(); }, rtab(a){ S.rtab=a; render(); }, btab(a){ go("eda",{btab:a}); }, setTab(a){ S.setTab=a; render(); },
  pfilter(a){ S.probFilter=a; render(); },
  select(a){ S.sel=a; S.rtab="props"; render(); },
  goto(a){ const o=JSON.parse(a); if(o.where==="release"){ go("eda",{side:"manufacturing"}); return; } if(o.where==="copilot"){ go("eda",{rtab:"copilot"}); return; }
    go("eda",{editor:o.where==="pcb"?"pcb":"schematic",sel:o.obj,flash:o.obj,rtab:"props"}); setTimeout(()=>{S.flash=null; if(S.ws==="eda") renderEditor()},1400); },
  undo(){ undo(); }, redo(){ redo(); },
  checkpoint(){ modal(`<div class="row"><h2>New checkpoint</h2>${pr("ckpt")}</div><input id="ckName" value="Before routing changes" aria-label="Checkpoint name"><div class="row"><span class="grow"></span><button data-act="closeModal">Cancel</button><button class="primary" data-act="saveCkpt">Save checkpoint at r${S.rev}</button></div>`); },
  saveCkpt(){ const n=(document.getElementById("ckName").value||"").trim()||"Checkpoint"; S.checkpoints.push({name:n,rev:S.rev}); closeModal(); render(); toast(`Checkpoint '${n}' saved at r${S.rev}`); },
  restoreCkpt(a){ const c=S.checkpoints[+a]; execute(`RestoreCheckpoint '${c.name}' (design as at r${c.rev})`,"you",()=>{}); toast(`Restore is a new revision (r${S.rev}) and can be undone. The demo records it without rewinding the sample design.`); },
  runErc(){ record("RunErc","you",s=>{s.erc={rev:s.rev,findings:runErc(s)}}); go("eda",{btab:"problems"}); const k=counts(S.erc.findings); toast(`ERC r${S.rev}: ${k.e} error(s), ${k.w} warning(s)`); },
  runDrc(){ record("RunDrc","you",s=>{s.drc={rev:s.rev,findings:runDrc(s)}}); go("eda",{btab:"problems",editor:"pcb"}); const k=counts(S.drc.findings); toast(`DRC r${S.rev}: ${k.e} error(s), ${k.u} UNKNOWN`); },
  updatePcb(){ go("eda",{editor:"pcb"}); ecoDialog(); },
  ecoRunErc(){ closeModal(); A.runErc(); ecoDialog(); },
  ecoToProblems(){ closeModal(); go("eda",{btab:"problems",editor:"schematic"}); },
  ecoApply(){ closeModal(); execute("SyncSchematicToPcb (Batch)","you",s=>{ s.pcbParts=s.parts.map(p=>p.ref); s.placed=s.placed.filter(r=>s.pcbParts.includes(r)); s.syncRev=s.rev+1; if(s.routed==="done") s.routed="auto"; }); toast("PCB updated as one change. New footprints wait right of the board: use Auto-place."); },
  autoplace(){ const u=S.pcbParts.filter(r=>!S.placed.includes(r)); if(!u.length){ toast(pcbInSync(S)?"Everything is placed.":"Nothing new to place. The schematic changed: run Update PCB first."); return; }
    execute(`AutoPlace (${u.join(", ")})`,"you",s=>{s.placed=[...s.pcbParts]}); go("eda",{editor:"pcb"}); },
  autoroute(){ if(S.pcbParts.some(r=>!S.placed.includes(r))){ toast("Place all footprints first (Auto-place)."); return; } if(S.routed!=="partial"){ toast("Already auto-routed."); return; }
    execute("AutoRoute","you",s=>{s.routed="auto"}); go("eda",{editor:"pcb"}); toast("Auto-route done; the 2 USB connections are left for hand routing."); },
  routeManual(){ if(S.routed==="partial"){ toast("Auto-route first; then route the USB pair by hand."); return; } if(S.routed==="done"){ toast("The USB pair is already routed."); return; }
    execute("AddTrack ×6 (USB_D+ / USB_D- by hand)","you",s=>{s.routed="done"}); go("eda",{editor:"pcb"}); toast("USB pair routed with the Route tool."); },
  pour(){ execute(S.pour?"Remove zone GND":"AddZone GND (bottom layer)","you",s=>{s.pour=!s.pour}); go("eda",{editor:"pcb"}); },
  releaseCheck(){ releaseDialog(); },
  releaseToProblems(){ closeModal(); go("eda",{btab:"problems",probFilter:"all"}); },
  genOutputs(){ record("Generate outputs to output/rev-"+S.rev,"you",s=>{s.outputsRev=s.rev}); toast("Gerber, drill, CPL, BOM and PDF written to output/rev-"+S.rev); },
  fabPrepare(){ const r=releaseCheck(S); S.release=r; render(); toast(r.blocked?"Not prepared: the release check is blocked. The blockers are in Problems.":"Package prepared for review. A person signs off; EAK never calls it manufacturing-ready."); },
  exportBom(){ const rows=[["Designator","Qty","Value","Manufacturer","MPN","Footprint"],...bomRows(S).map(r=>[r.refs.join(" "),r.refs.length,r.val,r.mfr,r.mpn,r.fp])]; const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="BOM.csv"; document.body.appendChild(a); a.click(); a.remove(); toast("BOM.csv downloaded ("+(rows.length-1)+" lines)"); },
  fileOpen(a){ if(a.startsWith("schematic")) go("eda",{editor:"schematic"}); else if(a.startsWith("pcb")) go("eda",{editor:"pcb"}); else if(a.startsWith("design-flow")) go("eda",{side:"brief"}); else if(a.startsWith("checkpoints")) go("eda",{side:"history"}); else if(a.startsWith("output")) go("eda",{side:"manufacturing"}); else toast(a+": EAK opens this in its file viewer (not reproduced in the demo)."); },
  libSearch(){ S.libQuery=document.getElementById("libQ").value; render(); },
  libSel(a){ S.libSel=a; render(); },
  place(a){ const c=cat(a); const n=c.cat==="Resistor"?"R":c.cat==="Capacitor"?"C":c.cat==="Inductor"?"L":/diode/i.test(c.cat)?"D":/jack|receptacle/i.test(c.cat)?"J":"U"; let i=1; while(has(S,n+i)) i++; const ref=n+i;
    execute(`PlaceSymbol ${ref} (${a})`,"you",s=>{const k=s.parts.length; s.parts.push({ref,mpn:a,val:c.spec.split(",")[0],x:40+(k*47)%800,y:296,w:44,h:24,h3d:1}); PCBPOS[ref]=PCBPOS[ref]||[3+(k*3)%50,38,2,1];},{schem:true}); go("eda",{editor:"schematic"}); toast(`${ref} placed. ERC and the PCB are now out of date.`); },
  declareCurrents(){ const v=S.brief.rails.map((r,i)=>document.getElementById("railI"+i).value.trim()); if(v.some(x=>!x||isNaN(+x)||+x<=0)){ toast("Enter a current in amps for every rail."); return; }
    execute(`SetNetCurrent +12V_IN ${v[0]} A, +3V3 ${v[1]} A`,"you",s=>{s.brief.rails.forEach((r,i)=>r.i=v[i]); s.currents=true}); toast("Currents declared. Re-run DRC: the width rule can now be checked."); },
  askAbout(a){ S.rtab="copilot"; if(!toolReady()){ render(); return; } const c=cat(S.parts.find(p=>p.ref===a).mpn); S.chat.push({who:"me",text:`Is ${a} right for this design?`},{who:"ai",text:`${a} (${c.mpn}): ${c.ds}. That fits the rails in the brief. Label: datasheet_supported. This is advice, not a check; ERC and DRC are the checks.`}); render(); },
  aiAsk(a){ aiStart(a); },
  aiSend(){ const el=document.getElementById("chatIn"); const t=(el&&el.value||"").trim(); if(!t){ toast("Type a question first."); return; } const k=/erc|power flag|\ben\b/i.test(t)?"erc":/pull/i.test(t)?"pullups":/current/i.test(t)?"currents":/clearance|drc/i.test(t)?"clear":null; aiStart(k,t); },
  answer(a){ aiAnswer(+a); },
  stopAi(){ stopAi(); },
  reviewProposal(){ reviewDialog(); },
  previewProposal(){ if(!S.proposal) return; S.proposal.preview=!S.proposal.preview; if(S.proposal.schem) S.editor="schematic"; render(); },
  applyProposal(){ applyProposal(false); },
  discardProposal(){ discardProposal(); },
  exportProposal(){ toast("Proposal report saved to evidence/proposal-r"+String(S.proposal.baseRev).padStart(6,"0")+".json (demo)"); },
  closeModal(){ closeModal(); },
  v3d(a){ S.view3d=a; render(); }, v3dParts(){ S.show3dParts=!S.show3dParts; render(); }, v3dMeasure(){ S.measure=!S.measure; render(); },
  termTab(a){ S.term.cur=+a; render(); },
  termNew(){ const id=S.term.next++; S.term.tabs.push({id,name:"shell "+id,cwd:"~/eak/"+S.project,out:"",agent:null,status:"idle"}); S.term.cur=id; render(); },
  termClose(a){ const T=S.term; if(T.tabs.length<2) return; T.tabs=T.tabs.filter(t=>t.id!==+a); if(T.cur===+a) T.cur=T.tabs[0].id; render(); },
  termSplit(){ S.term.split=!S.term.split; render(); }, termDetails(){ S.term.details=!S.term.details; render(); },
  termFocus(){ const i=document.getElementById("termIn"); if(i) i.focus(); },
  toolInstall(a){ modal(`<div class="row"><h2>Install ${TOOLS[a].label}</h2>${pr("aitools")}</div><div>EAK would link to the tool's official install page, then rescan. EAK does not install AI tools for you.</div><div class="row"><span class="grow"></span><button class="primary" data-act="closeModal">OK</button></div>`); },
  toolRescan(a){ toast(`${TOOLS[a].label}: still not found on this computer (demo).`); },
  toolSignin(a){ const id=S.term.next++; S.term.tabs.push({id,name:"sign in: "+TOOLS[a].label,cwd:"~",out:`<span class="faint">EAK started ${TOOLS[a].label}'s own sign-in here. Finish it in your browser. EAK never sees the credentials.</span>\n`,agent:null,status:"waiting"});
    toast(`Opened ${TOOLS[a].label}'s sign-in in a terminal tab (the Terminal workspace itself is unchanged).`); render();
    setTimeout(()=>{ S.tools[a].signed=true; const t=S.term.tabs.find(x=>x.id===id); if(t){t.status="ended"; t.out+="Signed in.\n"} render(); toast(TOOLS[a].label+": signed in"); },1200); },
  toolConnect(a){ const t=S.tools[a]; t.conn=!t.conn; render(); toast(t.conn?`${TOOLS[a].label} connected to ${S.project}: EAK registered its tool server with ${TOOLS[a].label}.`:`${TOOLS[a].label} disconnected.`); },
  toolTest(a){ const t=S.tools[a]; toast(!t.signed?`${TOOLS[a].label}: not signed in. Sign in first.`:!t.conn?`${TOOLS[a].label}: signed in, but not connected to this project.`:`${TOOLS[a].label}: ready. It can reach EAK's tools for ${S.project}.`); },
  saveKey(a){ const v=document.getElementById("key_"+a).value; if(!v){ toast("Paste a key first."); return; } S.modelKeys[a]=true; render(); toast("Saved (in EAK: to the OS keystore. The demo keeps only a flag, never the key)."); },
  testModel(a){ toast(S.modelKeys[a]?"Staged test: endpoint reached · key accepted · model list read (demo)":"No key saved: the first stage fails, as in EAK."); },
};
const CHANGE={
  fab(v){ S.fabProfile=v; render(); toast(v?"Profile chosen. Re-run the release check.":"No profile: fabricator capability stays UNKNOWN."); },
  perm(v){ S.permMode=v; render(); toast(v==="ask"?"Every AI change asks first.":"Reversible layout tweaks apply automatically; everything else asks."); },
  propRow(v,arg,el){ S.proposal.rows[+arg].on=el.checked; reviewDialog(); },
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(!t){ if(e.target.id==="modalWrap") closeModal(); return; }
  if(t.tagName==="INPUT"||t.tagName==="SELECT") return;
  const f=A[t.dataset.act]; if(!f){ console.error("no handler for",t.dataset.act); return; }
  e.stopPropagation(); f(t.dataset.arg);
});
document.addEventListener("change",e=>{ const t=e.target.closest("[data-act-change]"); if(t) CHANGE[t.dataset.actChange](t.value,t.dataset.arg,t); });
document.addEventListener("keydown",e=>{
  if(e.target.id==="termIn"&&e.key==="Enter"){ termRun(e.target.value); return; }
  if(e.target.id==="chatIn"&&e.key==="Enter"){ A.aiSend(); return; }
  if(e.target.id==="libQ"&&e.key==="Enter"){ A.libSearch(); return; }
  if(e.key==="Escape") closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&S.ws==="eda"&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){ e.preventDefault(); e.shiftKey?redo():undo(); }
});
// Self-checks used when testing the page: every control must map to a handler.
window.__deadControls=()=>[...document.querySelectorAll("[data-act]")].map(x=>x.dataset.act).filter(a=>!A[a]);
window.__buttonsWithoutAction=()=>[...document.querySelectorAll("button")].filter(b=>!b.dataset.act).map(b=>b.textContent.trim());
render();
</script>

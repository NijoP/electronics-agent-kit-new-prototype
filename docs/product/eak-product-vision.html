<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAK: electronics, engineered with agents</title>
<!-- EAK product vision. Interactive simulation with sample data. Self-contained: no network, no build.
     Design system and the storyboard-to-screen map: docs/product/README.md -->
<style>
:root{
  --h0:#0C0D0F;--h1:#121316;--h2:#17191C;--h3:#1E2024;--h4:#25282D;--h5:#2E3237;
  --hair:rgba(255,255,255,.05);
  --t1:#ECE8E1;--t2:#A7A29A;--t3:#6F6B65;
  --cu:#D8955C;--cu-soft:rgba(216,149,92,.14);--cu-line:rgba(216,149,92,.55);
  --ai:#86C5E0;--ai-soft:rgba(134,197,224,.13);
  --ok:#7FCB9B;--warn:#E2B35C;--err:#EC7C6B;--unk:#8A929E;--gold:#D4B36A;
  --lF:#D8955C;--lB:#6E9FD0;--l1:#5FA88A;--l2:#D07A8C;--edge:#E2B35C;--silk:#E9E6DE;
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,monospace;
  --e-ui:cubic-bezier(.2,.7,.1,1);--e-cam:cubic-bezier(.65,0,.15,1);
  --d1:140ms;--d2:240ms;
  --sh3:0 24px 64px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
}
@media (prefers-reduced-motion:reduce){:root{--d1:0ms;--d2:0ms}*{animation:none!important;transition:none!important}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--h0);color:var(--t1);font:400 13px/1.5 var(--ui);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--t1);background:var(--h3);border:0;border-radius:6px;padding:0 10px;height:30px;outline:none}
textarea{padding:10px 12px;height:auto;resize:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:0 0 0 1.5px var(--cu)}
.mono{font-family:var(--mono)}
.t2{color:var(--t2)}.t3{color:var(--t3)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:560}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.col{display:flex;flex-direction:column;min-width:0}
.grow{flex:1;min-width:0}
.btn{height:30px;padding:0 14px;border-radius:6px;background:var(--h3);color:var(--t1);white-space:nowrap;transition:background var(--d1) var(--e-ui)}
.btn:hover{background:var(--h4)}
.btn.pri{background:var(--cu);color:#1A1006;font-weight:560}.btn.pri:hover{background:#E3A36B}
.btn.ai{background:var(--ai-soft);color:var(--ai)}.btn.ai:hover{background:rgba(134,197,224,.2)}
.btn.q{background:none;color:var(--t2)}.btn.q:hover{background:var(--h3);color:var(--t1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;background:var(--h3);font-size:12px;color:var(--t2);white-space:nowrap}
.grain{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}

/* film */
#film{position:fixed;inset:0;z-index:50;background:var(--h0);transition:opacity 700ms var(--e-cam)}
#film.gone{opacity:0;pointer-events:none}
#film .layer{position:absolute;inset:0;opacity:0;transition:opacity 900ms var(--e-cam)}
#film .layer.on{opacity:1}
#film svg.scene{width:100%;height:100%;display:block}
#fText{position:absolute;left:0;right:0;bottom:20%;text-align:center;pointer-events:none}
#fText .t{font-weight:300;font-size:clamp(30px,3.4vw,56px);letter-spacing:-.01em;opacity:0;transform:translateY(8px);transition:opacity 900ms var(--e-cam),transform 900ms var(--e-cam)}
#fText .s{margin-top:14px;font-size:clamp(14px,1.2vw,18px);color:var(--t2);opacity:0;transition:opacity 900ms var(--e-cam) 300ms}
#fText.on .t{opacity:1;transform:none}#fText.on .s{opacity:1}
#fText.small .t{font-size:clamp(20px,1.9vw,30px)}
#fCtl{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;align-items:center;gap:16px}
#fActs{display:flex;gap:4px}
#fActs button{width:34px;height:28px;display:flex;align-items:center;justify-content:center}
#fActs button i{width:22px;height:2px;border-radius:1px;background:var(--h5);display:block;transition:background var(--d2)}
#fActs button.on i{background:var(--cu)}#fActs button.done i{background:var(--t3)}
#fBrand{position:absolute;left:32px;top:26px;display:flex;align-items:center;gap:12px;color:var(--t2);font-size:12px}
#fEnter{position:absolute;right:28px;top:20px}
#fHint{position:absolute;right:32px;bottom:34px;color:var(--t3);font-size:12px}
.mark{font-weight:640;letter-spacing:.14em;color:var(--t1);font-size:14px}
#fCanvas{position:absolute;inset:0;width:100%;height:100%}
#fSide{position:absolute;right:7%;top:50%;transform:translateY(-50%);width:300px;display:flex;flex-direction:column;gap:14px}
#fSide .it{opacity:0;transform:translateX(8px);transition:opacity 600ms var(--e-cam),transform 600ms var(--e-cam)}
#fSide .it.on{opacity:1;transform:none}

/* shell */
#app{position:fixed;inset:0;display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-rows:46px minmax(0,1fr) auto 26px;background:var(--h1);opacity:0;transform:scale(1.015);transition:opacity 700ms var(--e-cam),transform 900ms var(--e-cam)}
#app.on{opacity:1;transform:none}
#rail{grid-row:1/5;background:var(--h0);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px}
#rail .brand{height:36px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;width:40px;border-radius:8px}
#rail .brand:hover{background:var(--h2)}
#rail .nav{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t3);position:relative;transition:color var(--d1),background var(--d1)}
#rail .nav:hover{color:var(--t1);background:var(--h2)}
#rail .nav.on{color:var(--cu)}
#rail .nav.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:2px;border-radius:1px;background:var(--cu)}
#rail .nav .tip{position:absolute;left:50px;top:50%;transform:translateY(-50%) translateX(-4px);background:var(--h4);color:var(--t1);padding:4px 9px;border-radius:5px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--d1),transform var(--d1);z-index:20}
#rail .nav:hover .tip,#rail .nav:focus-visible .tip{opacity:1;transform:translateY(-50%)}
#rail .nav .tip kbd{color:var(--t3);font:11px var(--mono);margin-left:8px}
#top{display:flex;align-items:center;gap:14px;padding:0 14px 0 18px;background:var(--h1);min-width:0}
#top .crumb{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
#top .crumb .rev{font:12px var(--mono);color:var(--t3)}
#journey{display:flex;align-items:center;margin:0 auto;min-width:0}
#journey i{width:10px;height:1.5px;background:var(--h5);display:block}
.jd{width:18px;height:22px;display:flex;align-items:center;justify-content:center}
.jd span{width:10px;height:10px;border-radius:2.5px;box-shadow:inset 0 0 0 1.5px var(--t3);transition:background var(--d2)}
.jd.s2 span{background:var(--gold);box-shadow:none}.jd.s0 span{background:var(--err);box-shadow:none}.jd.s1 span{box-shadow:inset 0 0 0 1.5px var(--warn)}
.jd.nx span{outline:1.5px solid var(--cu-line);outline-offset:2px}
.jd:hover span{transform:scale(1.2)}
#journey .jl{margin-left:12px;font-size:12px;color:var(--t2);white-space:nowrap}
#search{height:30px;border-radius:7px;background:var(--h2);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--t3);font-size:12.5px;white-space:nowrap;transition:background var(--d1)}
#search:hover{background:var(--h3)}
#search kbd{font:11px var(--mono);color:var(--t3);margin-left:6px}
.ibtn{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);transition:background var(--d1),color var(--d1)}
.ibtn:hover{background:var(--h3);color:var(--t1)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn .ico{width:18px;height:18px}
#main{position:relative;min-height:0;overflow:hidden;background:var(--h1)}
.view{position:absolute;inset:0;display:none;min-height:0}
.view.on{display:flex;animation:vin var(--d2) var(--e-ui)}
@keyframes vin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#guide{grid-column:2;display:none;align-items:center;gap:14px;padding:8px 16px;min-height:52px;background:var(--h2)}
#guide.on{display:flex}
#guide .n{font:12px var(--mono);color:var(--t3);white-space:nowrap}
#guide .ti{font-weight:560;white-space:nowrap}
#guide .cap{color:var(--t2);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#guide .bar{width:120px;height:2px;background:var(--h5);border-radius:1px;overflow:hidden;flex:none}
#guide .bar b{display:block;height:100%;background:var(--cu);transition:width var(--d2) var(--e-ui)}
#foot{grid-column:2;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--h0);font-size:11.5px;color:var(--t3)}
#foot .about{margin-left:auto}
#foot button:hover{color:var(--t1)}

/* panels */
.side{width:264px;flex:none;background:var(--h2);display:flex;flex-direction:column;min-height:0}
.insp{width:320px;flex:none;background:var(--h2);display:flex;flex-direction:column;min-height:0}
.ph{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;flex:none}
.pb{flex:1;overflow:auto;min-height:0;padding:4px 14px 16px}
.canvas{flex:1;position:relative;min-width:0;background:var(--h0);overflow:hidden}
.canvas svg.c{width:100%;height:100%;display:block;cursor:grab}
.canvas svg.c.drag{cursor:grabbing}
.float{position:absolute;display:flex;gap:4px;align-items:center;background:rgba(23,25,28,.88);backdrop-filter:blur(8px);border-radius:8px;padding:4px}
.tabs{display:flex;gap:2px}
.tabs button{height:28px;padding:0 12px;border-radius:6px;color:var(--t2);font-size:12.5px;white-space:nowrap;transition:background var(--d1),color var(--d1)}
.tabs button:hover{color:var(--t1)}
.tabs button.on{background:var(--h4);color:var(--t1)}
.tree .n{display:flex;align-items:center;gap:6px;height:26px;padding:0 6px;border-radius:5px;color:var(--t2);font-size:12.5px;cursor:pointer;white-space:nowrap}
.tree .n:hover{background:var(--h3);color:var(--t1)}
.tree .n.on{background:var(--cu-soft);color:var(--t1)}
.tree .n .ico{width:15px;height:15px;color:var(--t3)}
.tree .n .car{width:12px;color:var(--t3);font-size:9px;text-align:center;transition:transform var(--d1)}
.tree .n .car.open{transform:rotate(90deg)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px;margin:0}
.kv dt{color:var(--t3)}.kv dd{margin:0;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.list .r{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;transition:background var(--d1)}
.list .r:hover,.list .r.on{background:var(--h3)}
.sec{margin-top:20px}
.sec > .lbl{display:block;margin-bottom:8px}
table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:560;text-align:left;padding:8px 10px;position:sticky;top:0;background:var(--h1)}
td{padding:8px 10px;font-size:12.5px;border-top:1px solid var(--hair)}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--h2)}
.toggle{width:28px;height:16px;border-radius:8px;background:var(--h5);position:relative;flex:none;transition:background var(--d1)}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--t2);transition:transform var(--d1) var(--e-ui),background var(--d1)}
.toggle.on{background:var(--cu-soft)}.toggle.on::after{transform:translateX(12px);background:var(--cu)}
.swatch{width:10px;height:10px;border-radius:2px;flex:none}
#schSvg polyline.hov{stroke:#E3A36B;stroke-width:2.2}
#schSvg text.hov{fill:#E3A36B}

/* home */
#v-home{overflow:auto}
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(380px,.9fr);width:100%;min-height:100%}
.home .l{padding:52px 56px 40px 64px;display:flex;flex-direction:column;gap:34px}
.home .r{background:var(--h2);padding:48px 48px 40px;display:flex;flex-direction:column;gap:26px}
.hello{font-weight:300;font-size:34px;letter-spacing:-.01em;line-height:1.15}
.intent{background:var(--h2);border-radius:12px;padding:6px 6px 6px 18px;display:flex;align-items:flex-end;gap:10px;transition:box-shadow var(--d2)}
.intent:focus-within{box-shadow:0 0 0 1.5px var(--cu-line)}
.intent textarea{flex:1;background:none;padding:12px 0;font-size:15px;min-height:52px;max-height:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:28px;padding:0 12px;border-radius:14px;background:var(--h2);color:var(--t2);font-size:12.5px;transition:background var(--d1),color var(--d1)}
.chips button:hover{background:var(--h3);color:var(--t1)}
.proj{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:18px;align-items:center;padding:12px;border-radius:10px;cursor:pointer;transition:background var(--d1)}
.proj:hover{background:var(--h2)}
.proj .thumb{height:76px;border-radius:6px;background:var(--h0);overflow:hidden}
.att{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 10px;border-radius:8px;cursor:pointer;text-align:left;width:100%;transition:background var(--d1)}
.att:hover{background:var(--h3)}
.att .dot{margin-top:6px}
.big{font-weight:300;font-size:40px;line-height:1}

/* overlays */
#scrim{position:fixed;inset:0;background:rgba(6,7,8,.55);z-index:60;display:none;align-items:center;justify-content:center}
#scrim.on{display:flex}
#dlg{background:var(--h3);border-radius:14px;box-shadow:var(--sh3);width:min(760px,92vw);max-height:84vh;overflow:auto;padding:26px 28px;display:flex;flex-direction:column;gap:16px;animation:pop var(--d2) var(--e-ui)}
#dlg.wide{width:min(1040px,94vw)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
#dlg h2{margin:0;font-weight:500;font-size:20px}
#pal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(620px,92vw);background:var(--h3);border-radius:12px;box-shadow:var(--sh3);z-index:70;display:none;overflow:hidden}
#pal.on{display:block;animation:pop var(--d2) var(--e-ui)}
#pal input{width:100%;height:50px;background:none;font-size:15px;padding:0 18px;border-radius:0}
#pal .res{max-height:50vh;overflow:auto;padding:6px}
#pal .it{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px}
#pal .it.on{background:var(--h4)}
#pal .it .k{margin-left:auto;color:var(--t3);font-size:11.5px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:var(--h4);padding:9px 16px;border-radius:8px;box-shadow:var(--sh3);font-size:12.5px;opacity:0;pointer-events:none;transition:opacity var(--d2),transform var(--d2) var(--e-ui);z-index:80;max-width:70vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.qopt{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:8px;background:var(--h4);margin-top:6px;transition:background var(--d1),box-shadow var(--d1)}
.qopt:hover{background:var(--h5)}
.qopt.on{box-shadow:0 0 0 1.5px var(--cu)}
.qrow{display:flex;gap:6px;flex-wrap:wrap}.qrow .qopt{width:auto;margin:0}

/* agents */
.thread{flex:1;overflow:auto;padding:26px 40px 20px;display:flex;flex-direction:column;gap:18px;min-height:0}
.msg{max-width:760px}
.msg.me{align-self:flex-end;background:var(--h3);padding:10px 14px;border-radius:12px 12px 4px 12px}
.msg .who{font-size:11.5px;color:var(--t3);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.planl{display:flex;flex-direction:column;gap:6px;font-size:13px}
.planl .s{display:flex;gap:10px;align-items:center;color:var(--t3);transition:color var(--d2)}
.planl .s.done{color:var(--t1)}.planl .s.run{color:var(--ai)}
.planl .s .b{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px currentColor;display:flex;align-items:center;justify-content:center}
.planl .s.done .b{background:var(--ok);box-shadow:none}
.cmds{background:var(--h0);border-radius:8px;padding:10px 14px;font:12px/1.75 var(--mono);color:var(--t2);white-space:pre-wrap}
.cmds b{color:var(--ai);font-weight:400}
.composer{padding:12px 40px 20px}
.composer .box{background:var(--h2);border-radius:12px;padding:6px 8px 8px 16px;transition:box-shadow var(--d2)}
.composer .box:focus-within{box-shadow:0 0 0 1.5px var(--ai)}
.composer textarea{width:100%;background:none;padding:10px 0 6px;font-size:14px;min-height:44px}
.prop{background:var(--h2);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.delta{display:flex;gap:24px;flex-wrap:wrap}
.delta .v{font-size:22px;font-weight:300}
.live{background:var(--h0);border-radius:12px;padding:14px 16px;max-width:760px;width:100%}
.ctx{display:flex;gap:6px;flex-wrap:wrap}
.ctx span{font-size:11.5px;color:var(--t2);background:var(--h3);border-radius:10px;padding:2px 9px}
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:760px;width:100%}
.lane{background:var(--h2);border-radius:10px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:box-shadow var(--d1)}
.lane.on{box-shadow:0 0 0 1.5px var(--ai)}
.tool{display:flex;align-items:center;gap:10px;padding:10px 6px;border-radius:8px}
.mono-av{width:28px;height:28px;border-radius:7px;background:var(--h4);display:flex;align-items:center;justify-content:center;font:600 11px var(--mono);color:var(--t2);flex:none}

/* terminal, misc */
.term{flex:1;background:#0A0B0C;font:12.5px/1.6 var(--mono);padding:14px 18px;overflow:auto;display:flex;flex-direction:column;min-width:0}
.term .out{white-space:pre-wrap;color:#CFCBC4}
.term input{background:none;height:auto;padding:0;width:100%;font:inherit;border-radius:0}
.term input:focus-visible{box-shadow:none}
#cv3d{width:100%;height:100%;display:block;cursor:grab}
.slider{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--h5);padding:0;width:140px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cu);cursor:pointer}
.slider::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--cu);cursor:pointer}
.ready .i{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;font-size:13px;border-radius:6px;cursor:pointer}
.ready .i:hover{background:var(--h3)}
@media (max-width:1360px){.insp{width:290px}.side{width:236px}.home .l{padding:40px 40px 32px 44px}.home .r{padding:40px 34px}#search .lbl2{display:none}}
</style>
</head>
<body>
<div class="grain"></div>

<section id="film" aria-label="EAK introduction">
  <div class="layer" id="L-pad"><svg class="scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" id="padSvg"></svg></div>

const RECIPES={
 erc:{title:"Resolve ERC findings",tool:"claude",intent:"Fix the ERC findings on the MCU and power sheets.",ctx:["Brief","ERC findings (3)","Sheets: MCU & USB, Power","ESP32-S3-WROOM-1 datasheet §EN"],

function newTask(key,free){const r=RECIPES[key];const t={id:Date.now()+Math.random(),key,title:r?r.title:"Question",tool:U.agentTool,st:"running",log:[{who:"me",text:free||r.intent}],plan:0,cmds:0,ans:null,base:D.rev};
 if(r&&!free&&U.tools[r.tool].st==="ready")t.tool=r.tool;
 if(U.tools[t.tool].st!=="ready"){const alt=Object.keys(U.tools).find(k=>U.tools[k].st==="ready");if(!alt){toast("Connect an AI tool first");return null;}t.tool=alt;}
 U.tasks.unshift(t);U.taskSel=t.id;return t;}
function runTask(t){const r=RECIPES[t.key];if(!r){t.st="done";renderAll();return;}
 if(r.q&&t.ans===null){t.st="question";renderAll();return;}
 t.st="running";const amps=t.ans===1?"1.2":"0.8";const sub=s=>s.replace("{rev}",t.base).replace(/\{amps\}/g,amps);
 t.planTxt=r.plan.map(sub);t.cmdTxt=r.cmds.map(sub);t.chTxt=r.changes.map(c=>c.map(sub));t.plan=0;t.cmds=0;t.amps=amps;renderAll();
 const step=()=>{if(t.st!=="running")return;if(t.cmds<t.cmdTxt.length){t.cmds++;t.plan=Math.min(t.planTxt.length-1,Math.floor(t.cmds*t.planTxt.length/(t.cmdTxt.length+1)));if(U.view==="agents")R.agents();renderShell();t.timer=setTimeout(step,RM?0:520);}else{t.plan=t.planTxt.length;buildProposal(t);}};
 t.timer=setTimeout(step,RM?0:520);}
function buildProposal(t){const r=RECIPES[t.key];const copy=clone(D);r.apply(copy,t.amps);t.base=D.rev;
 t.prop={copy,be:counts(ercRun(D)),ae:counts(ercRun(copy)),bd:counts(drcRun(D)),ad:counts(drcRun(copy))};t.st="review";renderAll();toast(`${U.tools[t.tool].name} has a proposal for you to review`);}
function liveCanvas(t){const r=RECIPES[t.key];if(!r||!t.planTxt||!(t.st==="running"||t.st==="review"))return"";const rev=t.st==="review",c=t.cmds;let svg;
 if(r.kind==="sch"){const d=rev?t.prop.copy:D;const nr=rev?["R3","C7"]:[c>=2?"R3":null,c>=3?"C7":null].filter(Boolean);svg=`<svg viewBox="0 0 1000 620" style="width:100%;height:100%">${schSvg(c>=6||rev?"pwr":"mcu",{newRefs:nr,d,flag:c>=6||rev})}</svg>`;}
 else if(t.key==="usb")svg=`<svg viewBox="-3 -3 62 46" style="width:100%;height:100%">${boardSvg({d:D,proposal:rev||c>=3?usbProposalSvg(false):""})}</svg>`;
 else{const d=rev?t.prop.copy:c>=4?(()=>{const x=clone(D);r.apply(x,t.amps);return x})():D;svg=`<svg viewBox="-3 -3 62 46" style="width:100%;height:100%">${boardSvg({d,hl:rev||c>=4?"+3V3":null,markers:1})}</svg>`;}
 return`<div class="live"><div class="row" style="margin-bottom:8px"><span class="lbl">${rev?"Proposed change · on a copy":"Live · tool calls on a copy of r"+t.base}</span><span class="grow"></span><span class="t3" style="font-size:11.5px">${rev?"Cyan is what the agent adds":"Updates with each EAK command"}</span></div><div style="height:300px">${svg}</div></div>`;}
const av=n=>`<span class="mono-av" style="width:20px;height:20px;font-size:9px">${n.slice(0,2).toUpperCase()}</span>`;
function taskView(t){const r=RECIPES[t.key];const tool=U.tools[t.tool];let h="";
 for(const m of t.log)h+=m.who==="me"?`<div class="msg me">${esc(m.text)}</div>`:`<div class="msg"><div class="who">${av(tool.name)}${tool.name}</div>${esc(m.text)}</div>`;
 if(r)h+=`<div class="msg"><div class="who">${av(tool.name)}${tool.name} · sees</div><div class="ctx">${r.ctx.map(x=>`<span>${esc(x)}</span>`).join("")}<span>r${t.base}</span></div></div>`;
 if(r&&r.q)h+=`<div class="msg"><div class="who">${av(tool.name)}${tool.name} asks</div><div>${esc(r.q[0])}</div>${t.ans===null?r.q[1].map((o,i)=>`<button class="qopt" data-a="answer" data-arg="${i}">${esc(o)}</button>`).join(""):`<div class="pill" style="margin-top:8px;color:var(--ai);background:var(--ai-soft)">${esc(r.q[1][t.ans])}</div>`}</div>`;
 if(t.planTxt)h+=`<div class="msg" style="width:100%"><div class="who">Plan</div><div class="planl">${t.planTxt.map((s,i)=>`<div class="s ${i<t.plan?"done":i===t.plan&&t.st==="running"?"run":""}"><span class="b">${i<t.plan?`<svg viewBox="0 0 14 14" width="10" height="10"><path d="M3 7l3 3 5-6" stroke="#0C0D0F" stroke-width="2" fill="none"/></svg>`:""}</span>${esc(s)}</div>`).join("")}</div>
  ${t.cmds?`<div class="cmds" style="margin-top:12px">${t.cmdTxt.slice(0,t.cmds).map(c=>`<div>${c}</div>`).join("")}</div>`:""}</div>`;
 h+=liveCanvas(t);
 if(t.st==="running")h+=`<div class="row"><span class="pill" style="color:var(--ai);background:var(--ai-soft)"><span class="dot" style="background:var(--ai);animation:blink 1.2s infinite"></span>Working</span><button class="btn q" data-a="stopTask">Stop</button><span class="t3" style="font-size:12px">Every action is an EAK command on a copy. Your design does not change until you apply.</span></div>`;
 if(t.prop&&["review","applied","discarded"].includes(t.st)){const p=t.prop;const stale=t.st==="review"&&t.base!==D.rev;
  h+=`<div class="prop"><div class="row"><span style="font-weight:560">Proposed change</span><span class="grow"></span>${t.st==="applied"?`<span class="pill" style="color:var(--ok)">Applied · r${t.appliedRev}</span>`:t.st==="discarded"?`<span class="pill">Discarded</span>`:`<span class="pill" style="color:var(--ai);background:var(--ai-soft)">Waiting for you</span>`}</div>
   <table><tbody>${t.chTxt.map(c=>`<tr><td style="width:60px" class="t2">${c[0]}</td><td>${esc(c[1])}</td><td class="t3" style="text-align:right">${c[2]}</td></tr>`).join("")}</tbody></table>
   <div class="delta">${[["ERC errors",p.be.e,p.ae.e],["ERC warnings",p.be.w,p.ae.w],["DRC errors",p.bd.e,p.ad.e],["DRC unknown",p.bd.u,p.ad.u]].map(x=>`<div><div class="t3" style="font-size:11.5px">${x[0]}</div><div class="v">${x[1]} <span class="t3">→</span> <span style="color:${x[2]<x[1]?"var(--ok)":x[2]>x[1]?"var(--err)":"var(--t1)"}">${x[2]}</span></div></div>`).join("")}</div>
   <div class="t3" style="font-size:11.5px">${r.labels.join(" · ")}. Checked by EAK on a copy, never self-reported by the agent.</div>
   ${t.st==="review"?`${stale?`<div style="color:var(--warn);font-size:12.5px">The design moved to r${D.rev} since this was checked.</div>`:""}<div class="row"><span class="grow"></span><button class="btn q" data-a="discardProp">Discard</button>${stale?`<button class="btn ai" data-a="recheck">Re-check on r${D.rev}</button>`:`<button class="btn pri" data-a="applyProp">Apply as r${D.rev+1}</button>`}</div>`:t.st==="applied"?`<div class="row"><span class="grow"></span><button class="btn q" data-a="undo">Undo</button></div>`:""}</div>`;}
 return h;}

 if(t.agent){if(cmd==="/exit"||cmd==="exit"){o=`<span style="color:#6F6B65">${U.tools[t.agent].name} session ended</span>\n`;t.agent=null;}
  else if(cmd){const k=/erc/i.test(cmd)?"erc":/usb|90/i.test(cmd)?"usb":/current|power/i.test(cmd)?"power":null;

 else if(cmd==="eak drc"){const d=drcRun(D);o=d.length?d.map(f=>`<span style="color:${f.sev==="err"?"#EC7C6B":f.sev==="warn"?"#E2B35C":"#8A929E"}">${f.sev==="err"?"error  ":f.sev==="warn"?"warn   ":"unknown"}</span> ${esc(f.msg)}`).join("\n")+"\n":`DRC clean · ${RULES_TOTAL} rules\n`;}
 else if(cmd==="eak bom")o=bomLines(D).map(l=>`${l.refs.join(",").padEnd(16)} ${l.mpn.padEnd(22)} ${String(l.refs.length).padStart(2)}`).join("\n")+"\n";
 else if(cmd==="claude"||cmd==="codex"){if(U.tools[cmd].st!=="ready")o=`${cmd}: not signed in\n`;else{t.agent=cmd;o=`<span style="color:#86C5E0">${U.tools[cmd].name}</span> (simulated) connected to Aurora S3 through EAK's tool server. Ask for a change, or /exit.\n`;}}
 else if(cmd)o=`${esc(cmd.split(" ")[0])}: not available in this simulation · try help\n`;
 t.out=(t.out||"")+line+o;R.term();renderShell();const i=$("#termIn");if(i)i.focus();}

 termFocus(){const i=$("#termIn");if(i)i.focus()},
 toast(a){toast(a)},
 enter(){enterApp()}, filmNext(){filmGo(FI+1)}, filmPrev(){filmGo(FI-1)}, act(a){filmGo(+a)},
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||el.tagName==="INPUT")return;if(el.disabled)return;const f=A[el.dataset.a];if(!f){console.error("no action",el.dataset.a);return;}e.stopPropagation();f(el.dataset.arg,el);});
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeDlg()});
document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
 if(e.target.id==="termIn"&&e.key==="Enter"){termRun(e.target.value);return;}
 if(e.target.id==="intentIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();A.intent();return;}
 if(e.target.id==="agentIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();A.agentSend();return;}
 if(filmOn){if(e.key===" "||e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();filmGo(FI+1);}else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();filmGo(FI-1);}else if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();enterApp();}else if(/^[1-3]$/.test(e.key))filmGo(+e.key-1);return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palOpen();return;}
 if(e.key==="Escape"){if($("#pal").classList.contains("on"))palClose();else closeDlg();return;}
 if(typing)return;
 if(U.guideOn&&(e.key==="ArrowRight"||e.key==="PageDown")){e.preventDefault();guideGo(U.gi+1);return;}
 if(U.guideOn&&(e.key==="ArrowLeft"||e.key==="PageUp")){e.preventDefault();guideGo(U.gi-1);return;}
 if(e.key.toLowerCase()==="g"&&!e.ctrlKey&&!e.metaKey){U.guideOn?A.guideClose():A.guideOpen();return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
 if($("#scrim").classList.contains("on"))return;
 if(/^[0-9]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey&&!e.altKey)go(VIEWS[(+e.key+9)%10][0]);});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".proj,.tree .n")){e.preventDefault();e.target.click();}});

/* opening: a short framing of the storyline (three beats, skippable) */
let FI=-1,filmOn=false,fTimers=[],fRaf=null;const fCam={yaw:-0.6,tilt:1.0,zoom:0.95};
const later=(fn,ms)=>fTimers.push(setTimeout(fn,RM?0:ms));
function fText(t,s,small){const el=$("#fText");el.classList.remove("on");el.classList.toggle("small",!!small);later(()=>{el.querySelector(".t").textContent=t||"";el.querySelector(".s").textContent=s||"";if(t)el.classList.add("on");},120);}
function layers(on){["L-pad","L-board","L-3d"].forEach(id=>$("#"+id).classList.toggle("on",on.includes(id)));}
function startFilm(i){filmOn=true;$("#film").classList.remove("gone");$("#app").classList.remove("on");$("#app").setAttribute("aria-hidden","true");$("#fActs").innerHTML=[0,1,2].map(k=>`<button data-a="act" data-arg="${k}" aria-label="Beat ${k+1}"><i></i></button>`).join("");FI=-1;filmGo(i||0);}
function filmGo(i){if(i<0)i=0;if(i>2){enterApp();return;}fTimers.forEach(clearTimeout);fTimers=[];cancelAnimationFrame(fRaf);FI=i;
 document.querySelectorAll("#fActs button").forEach((b,k)=>{b.classList.toggle("on",k===i);b.classList.toggle("done",k<i)});
 $("#fHint").textContent=i<2?"Space or → to continue":"Enter to begin the walkthrough";$("#fEnter").className=i===2?"btn pri":"btn";[beat1,beat2,beat3][i]();}
function padScene(trace){$("#padSvg").innerHTML=`<defs><radialGradient id="spec" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#F4DDA6"/><stop offset=".45" stop-color="#D4B36A"/><stop offset="1" stop-color="#8C7036"/></radialGradient><filter id="soft"><feGaussianBlur stdDeviation="18"/></filter></defs>
 <rect width="1440" height="900" fill="#0C0D0F"/><ellipse cx="560" cy="410" rx="260" ry="190" fill="#15171A" filter="url(#soft)"/>
 <rect x="536" y="402" width="56" height="40" rx="5" fill="#050606" opacity=".6"/><rect x="530" y="392" width="56" height="40" rx="5" fill="url(#spec)"/>
 ${trace?`<path id="trc" d="M586 412 H760 L820 352 H980 L1040 412 H1120" fill="none" stroke="#D8955C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" style="transition:stroke-dashoffset ${RM?0:1500}ms cubic-bezier(.65,0,.15,1)"/><circle id="via1" cx="820" cy="352" r="0" fill="#C9A866" style="transition:r 400ms"/><circle cx="820" cy="352" r="0" fill="#0C0D0F" id="via1h" style="transition:r 400ms"/><rect id="padB" x="1120" y="392" width="56" height="40" rx="5" fill="url(#spec)" opacity="0" style="transition:opacity 600ms"/>`:""}`;}
function beat1(){layers(["L-pad"]);padScene(false);fText("","");later(()=>fText("Every board begins with an intent.","",true),900);}
function beat2(){layers(["L-pad"]);padScene(true);fText("","");
 later(()=>{const t=$("#trc");if(t)t.style.strokeDashoffset="0";},200);
 later(()=>{const v=$("#via1"),h=$("#via1h");if(v){v.setAttribute("r","13");h.setAttribute("r","6");}},900);
 later(()=>{const b=$("#padB");if(b)b.style.opacity="1";},1500);
 later(()=>{$("#boardFilmSvg").innerHTML=`<g id="bfg" style="transform-origin:720px 450px;transform:scale(3.2);transition:transform ${RM?0:1400}ms cubic-bezier(.65,0,.15,1)"><svg x="290" y="140" width="860" height="620" viewBox="-3 -3 62 46">${boardSvg({d:Object.assign(clone(D),{usbRouted:true}),vis:{F:1,In1:1,In2:0,B:1,SilkF:1,Edge:1}})}</svg></g>`;layers(["L-board"]);requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=$("#bfg");if(g)g.style.transform="scale(.74) translateY(-110px)";}));},2300);
 later(()=>fText("EAK. Electronics, engineered with agents.","Describe the board. Agents draft it. EAK verifies every change before you accept it."),3000);}
function beat3(){layers(["L-3d"]);fText("","");const cv=$("#fCanvas"),side=$("#fSide");const dd=Object.assign(clone(D),{usbRouted:true});
 side.innerHTML=[["L1 · Top signal","1 oz copper · USB pair 0.26 / 0.15 mm","#D8955C"],["L2 · GND plane","Unbroken reference under every signal","#5FA88A"],["L3 · +3V3 plane","Kept clear of the antenna","#D07A8C"],["L4 · Bottom signal","I²C escape and GND pour","#6E9FD0"],["Fifteen moments, one engineer","From the first launch to the release check","#ECE8E1"]].map(x=>`<div class="it"><div style="font-size:13px;color:${x[2]}">${x[0]}</div><div class="t2" style="font-size:12.5px">${x[1]}</div></div>`).join("");
 const t0=performance.now();const loop=now=>{const k=Math.min(1,(now-t0)/(RM?1:2600));const ease=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;fCam.yaw=-0.6+0.25*Math.sin(now/4000);render3D(cv,fCam,{explode:ease,cx:.4,cy:.5,d:dd});if(!RM)fRaf=requestAnimationFrame(loop);};fRaf=requestAnimationFrame(loop);
 side.querySelectorAll(".it").forEach((el,i)=>later(()=>el.classList.add("on"),900+i*350));
 later(()=>fText("One model. Schematic, layout, 3D and manufacturing are views of the same design.","",true),2800);}
function enterApp(){if(!filmOn)return;filmOn=false;fTimers.forEach(clearTimeout);cancelAnimationFrame(fRaf);$("#film").classList.add("gone");$("#app").removeAttribute("aria-hidden");$("#app").classList.add("on");guideStart(0);}

window.__dead=()=>[...document.querySelectorAll("[data-a]")].map(x=>x.dataset.a).filter(a=>!A[a]);
window.__errors=[];window.addEventListener("error",e=>window.__errors.push(e.message));
renderAll();startFilm(0);

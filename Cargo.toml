[workspace]
resolver = "2"
members = [
    "crates/eak-core",
    "crates/eak-engineering",
    "crates/eak-validation",
    "crates/eak-runtime",
    "crates/eak-intelligence",
    "crates/eak-manufacturing",
    "crates/eak-simulation",
    "crates/eak-harness",
    "crates/eak-terminal",
    "crates/eak-library",
    "crates/eak-agents",
#    "apps/cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "LicenseRef-OSaasy"
rust-version = "1.80"
repository = "https://github.com/NijoP/electronics-agent-kit-new-prototype"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
eak-core = { path = "crates/eak-core" }
eak-engineering = { path = "crates/eak-engineering" }
eak-validation = { path = "crates/eak-validation" }
eak-runtime = { path = "crates/eak-runtime" }
eak-intelligence = { path = "crates/eak-intelligence" }
eak-manufacturing = { path = "crates/eak-manufacturing" }
eak-simulation = { path = "crates/eak-simulation" }
eak-harness = { path = "crates/eak-harness" }
eak-terminal = { path = "crates/eak-terminal" }
eak-library = { path = "crates/eak-library" }
eak-agents = { path = "crates/eak-agents" }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[workspace.lints.clippy]
# `!(x > 0.0)` is used deliberately so NaN inputs are rejected.
neg_cmp_op_on_partial_ord = "allow"
too_many_arguments = "allow"

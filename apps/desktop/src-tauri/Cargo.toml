[package]
name = "eak-desktop"
description = "EAK desktop shell: Tauri 2 IPC layer over the eak-runtime command engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "eak_desktop"
path = "src/lib.rs"

[[bin]]
name = "eak-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
eak-core.workspace = true
eak-runtime.workspace = true
eak-validation.workspace = true
eak-manufacturing.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

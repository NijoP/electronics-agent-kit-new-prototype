[package]
name = "eak-desktop"
description = "EAK desktop shell: Tauri 2 IPC layer over the eak-runtime command engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "eak_desktop"
path = "src/lib.rs"

[[bin]]
name = "eak-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
eak-core.workspace = true
eak-engineering.workspace = true
eak-intelligence = { workspace = true, features = ["remote-http"] }
eak-runtime.workspace = true
eak-validation.workspace = true
eak-manufacturing.workspace = true
eak-simulation.workspace = true
eak-harness.workspace = true
eak-terminal.workspace = true
eak-agents.workspace = true
serde.workspace = true
serde_json.workspace = true
# Semaphore for the bounded job classes (resources.rs). Already in the tree via tauri; "sync" only.
tokio = { version = "1", default-features = false, features = ["sync"] }
# OS credential storage for model API keys (owner-approved; keys are never stored anywhere else).
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[lints]
workspace = true

# Real-window UI evidence: builds the desktop app, runs it under Xvfb (GDK_BACKEND=x11), drives
# a data-driven scenario with real X input (XTest) and uploads the screenshots as an artifact.
# Separate workflow, not a required check; the job fails (red) when any scenario row fails or a
# results file or screenshot is missing, and still uploads the artifact and job summary.
# How to add steps: docs/qa/UI_EVIDENCE.md.
name: ui-evidence
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ui-evidence.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ui-evidence.yml"
  workflow_dispatch:
    inputs:
      remove_results:
        description: "Gate self-test: delete this scenario's results file (e.g. e5) before the results gate; the job must then fail"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: ui-evidence-${{ github.ref }}
  # A newer push to main must not cancel the evidence run of the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  linux-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/e2e/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-evidence
      - name: System libraries, X server and X tools
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
          xvfb xdotool imagemagick
      - name: WebKitWebDriver (package renamed across Ubuntu releases)
        run: |
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          command -v WebKitWebDriver || sudo ln -s "$(find /usr -name WebKitWebDriver -type f | head -1)" /usr/local/bin/WebKitWebDriver
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Debug build of the desktop app (frontend embedded)
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --debug --no-bundle
      - name: Scenario dependencies
        working-directory: apps/desktop/e2e
        run: npm ci
      - name: Run scenario under Xvfb
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence
          UI_SCENARIO: scenarios/a1-menus.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      - name: Run E2 editor-correctness scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/e2
          UI_SCENARIO: scenarios/e2-editor.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # E3 (engine boundary and library provenance): its own fresh app instance and fixture.
      - name: Run E3 scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/e3
          UI_SCENARIO: scenarios/e3-engine-provenance.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      - name: Run D4 settings scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/d4
          UI_SCENARIO: scenarios/d4-settings.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # W2-E (ADR-0054): Settings > AI tools is honest on a runner without Claude Code or Codex.
      - name: Run W2 AI tools scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/w2
          UI_SCENARIO: scenarios/w2-ai-tools.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B1 (IR schema v3): regression that a v3 project opens and draws a placed part.
      - name: Run B1 scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b1
          UI_SCENARIO: scenarios/b1-ir-v3.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C2 (ECO preview): Update PCB opens the engine's read-only preview; Apply sends one Batch.
      - name: Run C2 ECO preview scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c2
          UI_SCENARIO: scenarios/c2-eco.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # G4 (S9, ADR-0051): an agent proposal made through the app harness endpoint in propose mode,
      # reviewed (rows by object, ERC/DRC on a copy), partly applied as one undo step, then discarded.
      - name: Run G4 agent proposal scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/g4
          UI_SCENARIO: scenarios/g4-proposal.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # W2 (WEFT, ADR-0053): two scripted agent sessions message over the WEFT bus through the app
      # harness endpoint; the activity view shows each agent's timeline from the journals only.
      - name: Run W2 agent activity scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/w2
          UI_SCENARIO: scenarios/w2-activity.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # W3 (WEFT, ADR-0053): conflicts among agent proposals and review requests routed to the
      # engineer, answered from the activity view on the bus (Re-propose, Reject, Approve).
      - name: Run W3 WEFT conflicts and engineer review scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/w3
          UI_SCENARIO: scenarios/w3-weft-review.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # M2 (Agents workspace, ADR-0058): the rail opens the Agents workspace; roster, tasks, needs-you,
      # inspector and runtimes from real state, and Request changes answered on the WEFT bus.
      - name: Run M2 Agents workspace scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/m2
          UI_SCENARIO: scenarios/m2-agents.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C3 (routing experience): the Route tool's routing options in the inspector.
      - name: Run C3 routing scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c3
          UI_SCENARIO: scenarios/c3-routing.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B2 (symbol rendering): built-in and imported KiCad symbols drawn from their v3 graphics.
      - name: Run B2 scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b2
          UI_SCENARIO: scenarios/b2-symbols.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # D1 (library dock): its own fresh app instance and fixture.
      - name: Run D1 library dock scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/d1
          UI_SCENARIO: scenarios/d1-library.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # D3 (output documents: BOM dialog, schematic PDF/SVG, netlists): its own fresh instance.
      - name: Run D3 output scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/d3
          UI_SCENARIO: scenarios/d3-output.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # D2 (symbol and footprint editors): a part created in the editors places, syncs, passes DRC
      # on a fixture board and exports.
      - name: Run D2 editors scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/d2
          UI_SCENARIO: scenarios/d2-editors.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B3 (schematic editing set): multi-select, align, duplicate, context menu, find, filter.
      - name: Run B3 editing scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b3
          UI_SCENARIO: scenarios/b3-editing.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B3 follow-ups (ADR-0045, IR v6): Inspector rename as one RenameNetLabel; Group, a click
      # selecting the whole group, Ungroup, and one Undo restoring the group.
      - name: Run B3 groups scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b3g
          UI_SCENARIO: scenarios/b3-groups.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # F3 (schematic edit integrity, audit S4): a part wired by Connect pins is moved by
      # click-click; the move is one rubber-band Batch and Highlight net still lights both pins.
      - name: Run F3 edit integrity scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/f3
          UI_SCENARIO: scenarios/f3-edit-integrity.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B6 (sheet management): Pages-tab Add, Rename, Move up and Delete (asks first when the
      # sheet is not empty; one Batch), then one undo restores the sheet and its part.
      - name: Run B6 sheets scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b6
          UI_SCENARIO: scenarios/b6-sheets.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C6/E6 (3D as a document): tab, menu set, IR stack-up, placeholders, cross-probe, camera.
      - name: Run C6 3D scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c6
          UI_SCENARIO: scenarios/c6-3d.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # F9 (library and panels honesty): Add to project of an imported part, plain-text external
      # addresses, disabled-button reasons, Distributor not configured, Performance section shown.
      - name: Run F9 library and panels honesty scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/f9
          UI_SCENARIO: scenarios/f9-honesty.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # F10 (rules, inspector reasons, small PCB fixes): max component height clear (ADR-0050),
      # footprint 3D model row, arc-corners reason, disabled route buttons with reasons.
      - name: Run F10 rules and reasons scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/f10
          UI_SCENARIO: scenarios/f10-rules-reasons.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # F7 (navigation and cross-probe, audit S11/S12): an ERC finding and Quick open of a symbol
      # on Sheet 2 open the Sheet 2 document and select the part there.
      - name: Run F7 navigation scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/f7
          UI_SCENARIO: scenarios/f7-navigation.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C4 (schema v4 PCB objects, ADR-0042): arc edge, cut-out, keep-out drawn; DRC-021 reported.
      - name: Run C4 PCB objects scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c4
          UI_SCENARIO: scenarios/c4-pcb-objects.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C1 (layer UX): layer tab strip, layer keys, lock, flip / outline views, persistence.
      - name: Run C1 layer UX scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c1
          UI_SCENARIO: scenarios/c1-layers.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # E5 (planes and stack-up): engine zone fill, Stitch zones, stack-up edits and their round trip,
      # plane-net assignment.
      - name: Run E5 planes and stack-up scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/e5
          UI_SCENARIO: scenarios/e5-planes.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B4 (place tools): wire corner modes and guides, power port, off-page connector, bus, bus
      # entry, sheet text and rectangle, fan-out, Settings > Power ports.
      - name: Run B4 place tools scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b4
          UI_SCENARIO: scenarios/b4-place.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B5 (findings panel): severity chips, object references and CSV/JSON export of the ERC report.
      - name: Run B5 findings scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b5
          UI_SCENARIO: scenarios/b5-findings.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # E4 (bottom dock): Property List batch edit as one Batch and one undo step, Find Results
      # from the B3 find bar, Diagnostics (Unknown never shown as OK).
      - name: Run E4 bottom dock scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/e4
          UI_SCENARIO: scenarios/e4-bottom-dock.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # E9 (Assets view): model reference, datasheet, provenance, imported library licence, and
      # outputs per revision (an export listed under the current revision, its DRAFT manifest, a
      # file opened in the viewer), then a refdes link selecting the part.
      - name: Run E9 assets scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/e9a
          UI_SCENARIO: scenarios/e9-assets.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # E7 (release check): read-only gate view; NOT_RUN reports block the release (DRAFT), the
      # run saves the four reports, and a new revision makes them NOT_RUN again.
      - name: Run E7 release check scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/e7
          UI_SCENARIO: scenarios/e7-release.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # F2 (PCB editor ops): a real click selects a track and Edit › Delete removes it with
      # DeleteTrack (never DeleteSymbol); the Via tool has no dead Layer field.
      - name: Run F2 PCB ops scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/f2
          UI_SCENARIO: scenarios/f2-pcb-ops.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # F8 (keys and modality): no global key behind an aria-modal dialog (Ctrl+Z with Design rules
      # open does not undo), a shell key refused for rebinding, and a rebinding shown in a dock tooltip.
      - name: Run F8 keys and modality scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/f8
          UI_SCENARIO: scenarios/f8-keys.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # F6 (Phase 1 PCB workflow, no SETUP): new project through Project Home (native folder
      # chooser) and File > New project; two parts wired, ERC, outline drawn, Update PCB,
      # auto-place, one net routed by clicks with a layer change and two vias, auto-route, clear
      # routing and undo, a zone drawn and refilled, DRC, export, release check DRAFT.
      - name: Run F6 PCB workflow scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/f6
          UI_SCENARIO: scenarios/p1-pcb-flow.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # G1 (slice S1, Project Home and first run): no SETUP step. The first-run tour (skip, replay
      # from Help), New Project in the default projects folder, the prompt box creating a project and
      # its brief without AI, the sample board, and Needs attention items opening their place.
      - name: Run G1 Project Home and first-run scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/g1
          UI_SCENARIO: scenarios/g1-home-firstrun.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # G2 (report §10 S2, S3): the journey bar coloured from current reports only, a stage click
      # opening its view; the Problems tab with not-run checks named, release blockers, ERC findings
      # going through the F7 navigation, an UNKNOWN DRC rule naming its missing input, and filters.
      - name: Run G2 journey bar and Problems scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/g2
          UI_SCENARIO: scenarios/g2-problems.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # Fails the job when a scenario wrote no results file (it crashed or never ran); failing
      # rows already failed their own step. Runs before the upload, which still runs (always()).
      # The scenario list is every UI_OUT of this file, so a new scenario step is gated (and
      # uploaded, by the globs below) without editing a second list.
      - name: Results gate self-test (workflow_dispatch remove_results)
        if: always() && inputs.remove_results != ''
        env:
          REMOVE: ${{ inputs.remove_results }}
        run: |
          case "$REMOVE" in *[!a-z0-9]*) echo "::error::remove_results must be a scenario directory such as e5"; exit 1 ;; esac
          rm -v "${{ runner.temp }}/ui-evidence/$REMOVE/UI_EVIDENCE.md"
      - name: Results to job summary
        if: always()
        run: |
          missing=0
          dirs=$(sed -nE 's#^ +UI_OUT: \$\{\{ runner\.temp \}\}/ui-evidence/?([a-z0-9]*) *$#\1#p' .github/workflows/ui-evidence.yml)
          [ -n "$dirs" ] || { echo "::error::no UI_OUT found in ui-evidence.yml"; exit 1; }
          while IFS= read -r d; do
            f="${{ runner.temp }}/ui-evidence/${d:+$d/}UI_EVIDENCE.md"
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**MISSING: no ${d:-a1} results file** ($f)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::no ${d:-a1} results file: $f"
              missing=1
            fi
          done <<< "$dirs"
          exit $missing
      # Globs: every scenario directory (and the A1 root) is archived, e5 and any later one included.
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-screenshots
          path: |
            ${{ runner.temp }}/ui-evidence/**/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/**/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/**/tauri-driver.log
          if-no-files-found: warn

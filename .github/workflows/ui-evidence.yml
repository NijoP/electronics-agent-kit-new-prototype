# Real-window UI evidence: builds the desktop app, runs it under Xvfb (GDK_BACKEND=x11), drives
# a data-driven scenario with real X input (XTest) and uploads the screenshots as an artifact.
# Separate workflow, not a required check; the job fails (red) when any scenario row fails or a
# results file or screenshot is missing, and still uploads the artifact and job summary.
# How to add steps: docs/qa/UI_EVIDENCE.md.
name: ui-evidence
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ui-evidence.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ui-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-evidence-${{ github.ref }}
  # A newer push to main must not cancel the evidence run of the commit before it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  linux-xvfb:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/e2e/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui-evidence
      - name: System libraries, X server and X tools
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
          xvfb xdotool imagemagick
      - name: WebKitWebDriver (package renamed across Ubuntu releases)
        run: |
          sudo apt-get install -y webkitgtk-webdriver || sudo apt-get install -y webkit2gtk-driver
          command -v WebKitWebDriver || sudo ln -s "$(find /usr -name WebKitWebDriver -type f | head -1)" /usr/local/bin/WebKitWebDriver
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: Debug build of the desktop app (frontend embedded)
        working-directory: apps/desktop
        run: |
          npm ci
          npx tauri build --debug --no-bundle
      - name: Scenario dependencies
        working-directory: apps/desktop/e2e
        run: npm ci
      - name: Run scenario under Xvfb
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence
          UI_SCENARIO: scenarios/a1-menus.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      - name: Run E2 editor-correctness scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/e2
          UI_SCENARIO: scenarios/e2-editor.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # E3 (engine boundary and library provenance): its own fresh app instance and fixture.
      - name: Run E3 scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/e3
          UI_SCENARIO: scenarios/e3-engine-provenance.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      - name: Run D4 settings scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/d4
          UI_SCENARIO: scenarios/d4-settings.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B1 (IR schema v3): regression that a v3 project opens and draws a placed part.
      - name: Run B1 scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b1
          UI_SCENARIO: scenarios/b1-ir-v3.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C2 (ECO preview): Update PCB opens the engine's read-only preview; Apply sends one Batch.
      - name: Run C2 ECO preview scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c2
          UI_SCENARIO: scenarios/c2-eco.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C3 (routing experience): the Route tool's routing options in the inspector.
      - name: Run C3 routing scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c3
          UI_SCENARIO: scenarios/c3-routing.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B2 (symbol rendering): built-in and imported KiCad symbols drawn from their v3 graphics.
      - name: Run B2 scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b2
          UI_SCENARIO: scenarios/b2-symbols.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # D1 (library dock): its own fresh app instance and fixture.
      - name: Run D1 library dock scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/d1
          UI_SCENARIO: scenarios/d1-library.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # D3 (output documents: BOM dialog, schematic PDF/SVG, netlists): its own fresh instance.
      - name: Run D3 output scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/d3
          UI_SCENARIO: scenarios/d3-output.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # D2 (symbol and footprint editors): a part created in the editors places, syncs, passes DRC
      # on a fixture board and exports.
      - name: Run D2 editors scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/d2
          UI_SCENARIO: scenarios/d2-editors.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B3 (schematic editing set): multi-select, align, duplicate, context menu, find, filter.
      - name: Run B3 editing scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b3
          UI_SCENARIO: scenarios/b3-editing.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # B6 (sheet management): Pages-tab Add, Rename, Move up and Delete (asks first when the
      # sheet is not empty; one Batch), then one undo restores the sheet and its part.
      - name: Run B6 sheets scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/b6
          UI_SCENARIO: scenarios/b6-sheets.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C6/E6 (3D as a document): tab, menu set, IR stack-up, placeholders, cross-probe, camera.
      - name: Run C6 3D scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c6
          UI_SCENARIO: scenarios/c6-3d.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C4 (schema v4 PCB objects, ADR-0042): arc edge, cut-out, keep-out drawn; DRC-021 reported.
      - name: Run C4 PCB objects scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c4
          UI_SCENARIO: scenarios/c4-pcb-objects.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # C1 (layer UX): layer tab strip, layer keys, lock, flip / outline views, persistence.
      - name: Run C1 layer UX scenario under Xvfb
        if: always()
        working-directory: apps/desktop/e2e
        env:
          EAK_APP: ${{ github.workspace }}/target/debug/eak-desktop
          UI_OUT: ${{ runner.temp }}/ui-evidence/c1
          UI_SCENARIO: scenarios/c1-layers.json
          GDK_BACKEND: x11
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node ui-evidence.mjs
      # Fails the job when a scenario wrote no results file (it crashed or never ran); failing
      # rows already failed their own step. Runs before the upload, which still runs (always()).
      - name: Results to job summary
        if: always()
        run: |
          missing=0
          for d in "" e2 e3 d4 b1 c2 c3 b2 d1 d3 d2 b3 b6 c6 c4 c1; do
            f="${{ runner.temp }}/ui-evidence/${d:+$d/}UI_EVIDENCE.md"
            if [ -f "$f" ]; then
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "**MISSING: no ${d:-a1} results file** ($f)" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::no ${d:-a1} results file: $f"
              missing=1
            fi
          done
          exit $missing
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-screenshots
          path: |
            ${{ runner.temp }}/ui-evidence/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/tauri-driver.log
            ${{ runner.temp }}/ui-evidence/e2/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/e2/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/e3/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/e3/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/e3/tauri-driver.log
            ${{ runner.temp }}/ui-evidence/d4/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/d4/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/b1/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/b1/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/c2/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/c2/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/c3/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/c3/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/b2/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/b2/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/d1/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/d1/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/d1/tauri-driver.log
            ${{ runner.temp }}/ui-evidence/d3/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/d3/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/d3/tauri-driver.log
            ${{ runner.temp }}/ui-evidence/d2/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/d2/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/b3/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/b3/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/b6/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/b6/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/c6/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/c6/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/c4/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/c4/UI_EVIDENCE.md
            ${{ runner.temp }}/ui-evidence/c1/screenshots/*.png
            ${{ runner.temp }}/ui-evidence/c1/UI_EVIDENCE.md
          if-no-files-found: warn

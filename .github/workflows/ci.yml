name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Python-free policy
        run: bash scripts/check-no-python.sh
      - name: Frontend install, typecheck, tests
        working-directory: apps/desktop
        env:
          # A failing UI test prints the whole DOM, not the first 7000 characters.
          DEBUG_PRINT_LIMIT: "200000"
        run: |
          npm ci
          npm run typecheck
          npm test
      # The Tauri context macro embeds apps/desktop/dist, so the frontend must be built
      # before any cargo step compiles apps/desktop/src-tauri.
      - name: Frontend build (embedded by the desktop crate)
        working-directory: apps/desktop
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: eak-intelligence offline build (no remote-http) and remote-http build
        run: |
          cargo test -p eak-intelligence --no-default-features --locked
          cargo clippy -p eak-intelligence --all-targets --features remote-http --locked -- -D warnings
          cargo test -p eak-intelligence --features remote-http --locked

  # Windows and macOS are equal targets: run the workspace tests natively there too.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; macos-15-intel is the x64 image (macos-13 was retired).
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Frontend install and build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

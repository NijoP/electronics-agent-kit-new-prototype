name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - name: Python-free policy
        run: bash scripts/check-no-python.sh
      - name: Frontend install, typecheck, tests
        working-directory: apps/desktop
        env:
          # A failing UI test prints the whole DOM, not the first 7000 characters.
          DEBUG_PRINT_LIMIT: "200000"
        run: |
          npm ci
          npm run typecheck
          npm test
      # E9: `npm test` fails on a visible control with no handler and no explicit unavailable
      # state (src/qa/uiInventory.test.ts). This step regenerates docs/qa/UI_INVENTORY.md, shows
      # its diff against the committed file in the job summary and uploads it; a stale doc does
      # not fail the build, so lanes that add controls are not blocked on regenerating it.
      - name: UI inventory (regenerate and diff)
        if: always()
        working-directory: apps/desktop
        run: |
          UPDATE_UI_INVENTORY=1 npx vitest run src/qa/uiInventory.test.ts || true
          git add -N ../../docs/qa/UI_INVENTORY.md 2>/dev/null || true
          {
            echo "## UI inventory diff (docs/qa/UI_INVENTORY.md)"
            if git diff --quiet -- ../../docs/qa/UI_INVENTORY.md; then echo "Up to date."; else
              echo "Out of date: commit the \`ui-inventory\` artifact. Diff:"; echo '```diff'; git diff -- ../../docs/qa/UI_INVENTORY.md | head -400; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=ui-inventory-gz-b64::$(gzip -9c ../../docs/qa/UI_INVENTORY.md | base64 -w0)"
      - name: Upload UI inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-inventory
          path: docs/qa/UI_INVENTORY.md
          if-no-files-found: warn
      # The Tauri context macro embeds apps/desktop/dist, so the frontend must be built
      # before any cargo step compiles apps/desktop/src-tauri.
      - name: Frontend build (embedded by the desktop crate)
        working-directory: apps/desktop
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: eak-intelligence offline build (no remote-http) and remote-http build
        run: |
          cargo test -p eak-intelligence --no-default-features --locked
          cargo clippy -p eak-intelligence --all-targets --features remote-http --locked -- -D warnings
          cargo test -p eak-intelligence --features remote-http --locked

  # Windows and macOS are equal targets: run the workspace tests natively there too.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; macos-15-intel is the x64 image (macos-13 was retired).
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Frontend install and build
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

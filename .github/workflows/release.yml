name: release
# Builds the desktop bundles and the `eak` CLI from ONE commit that the `ci` workflow already proved
# green, checksums them, and publishes a pre-release with a provenance file. Manual dispatch only:
#   gh workflow run release.yml -R NijoP/electronics-agent-kit-new-prototype [-f sha=<full commit sha>]
# Every build is UNSIGNED (no signing secrets exist): Windows SmartScreen / macOS Gatekeeper apply.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full commit sha to release (empty = the tip of the selected ref). Its ci run must be green.'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  verify:
    name: verify the commit is green
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      ci_run: ${{ steps.pick.outputs.ci_run }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit id, got '$sha'" >&2; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.workflow_runs[0].html_url // empty')"
          [ -n "$run" ] || { echo "no successful ci run exists for $sha: refusing to release a commit CI has not proved" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ci_run=$run" >> "$GITHUB_OUTPUT"
          echo "Releasing $sha (green ci run: $run)" | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    name: package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04, os: linux, arch: x86_64, bundles: 'deb,appimage' }
          - { name: windows-x86_64, runner: windows-latest, os: windows, arch: x86_64, bundles: nsis }
          - { name: macos-aarch64, runner: macos-latest, os: macos, arch: aarch64, bundles: dmg }
          - { name: macos-x86_64, runner: macos-15-intel, os: macos, arch: x86_64, bundles: dmg }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Linux system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev pkg-config file
      - name: Desktop bundles (unsigned)
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run tauri -- build --ci --bundles "${{ matrix.bundles }}"
      - name: eak CLI and MCP server
        run: cargo build --release --locked -p eak-harness --bins
      - name: Collect assets, CLI archive and checksums
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist-assets"
          bash scripts/collect-release-assets.sh "${{ matrix.os }}" "${{ matrix.arch }}" "$out"
          bin=target/release
          if [ "${{ matrix.os }}" = windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$bin/eak.exe','$bin/eak-mcp.exe' -DestinationPath '$out/eak-cli-windows-${{ matrix.arch }}.zip'"
          else
            tar -C "$bin" -czf "$out/eak-cli-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" eak eak-mcp
          fi
          {
            echo "runner_image: ${{ matrix.runner }} ($RUNNER_OS $RUNNER_ARCH)"
            echo "rustc: $(rustc -V)"
            echo "cargo: $(cargo -V)"
            echo "node: $(node -v)"
            echo "npm: $(npm -v)"
          } > "$out/toolchain-${{ matrix.name }}.txt"
          cd "$out"
          rm -f SHA256SUMS
          files="$(ls | grep -v '^toolchain-')"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -- $files > "SHA256SUMS.${{ matrix.name }}"; else shasum -a 256 -- $files > "SHA256SUMS.${{ matrix.name }}"; fi
          cat "SHA256SUMS.${{ matrix.name }}"
      - name: Installer smoke test with the verified local assets (Linux, macOS)
        if: matrix.os != 'windows'
        env:
          EAK_ASSET_DIR: ${{ github.workspace }}/dist-assets
          EAK_NO_LAUNCH: '1'
        run: |
          set -euo pipefail
          cp "$EAK_ASSET_DIR/SHA256SUMS.${{ matrix.name }}" "$EAK_ASSET_DIR/SHA256SUMS"
          bash scripts/install.sh
          bash scripts/install.sh --uninstall
          rm -f "$EAK_ASSET_DIR/SHA256SUMS"
      - name: Installer smoke test with the verified local assets (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          EAK_ASSET_DIR: ${{ github.workspace }}\dist-assets
          EAK_NO_LAUNCH: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "$env:EAK_ASSET_DIR\SHA256SUMS.${{ matrix.name }}" "$env:EAK_ASSET_DIR\SHA256SUMS"
          & ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          $env:EAK_UNINSTALL = '1'
          & ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          Remove-Item "$env:EAK_ASSET_DIR\SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: eak-${{ matrix.name }}
          path: dist-assets/*
          if-no-files-found: error

  publish:
    name: publish pre-release
    needs: [verify, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Combine checksums, write provenance, publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verify.outputs.sha }}
          CI_RUN: ${{ needs.verify.outputs.ci_run }}
        run: |
          set -euo pipefail
          cd assets
          cat SHA256SUMS.* | sort -k2 > SHA256SUMS
          rm -f SHA256SUMS.*
          # Every listed file must exist and hash to its listed value.
          sha256sum -c SHA256SUMS
          tag="prebuilt-$(date -u +%Y%m%d)-${SHA:0:7}"
          {
            echo '{'
            echo "  \"commit\": \"$SHA\","
            echo "  \"tag\": \"$tag\","
            echo "  \"ci_run\": \"$CI_RUN\","
            echo "  \"release_run\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\","
            echo "  \"built_at_utc\": \"$(date -u +%FT%TZ)\","
            echo '  "signing": "unsigned (no signing secrets exist)",'
            echo '  "toolchains": {'
            first=1
            for t in toolchain-*.txt; do
              [ "$first" = 1 ] || echo ','
              first=0
              printf '    "%s": %s' "${t#toolchain-}" "$(jq -Rs . < "$t")"
            done
            echo
            echo '  },'
            echo '  "sha256": {'
            awk 'NR>1{printf ",\n"} {printf "    \"%s\": \"%s\"", $2, $1}' SHA256SUMS
            echo
            echo '  }'
            echo '}'
          } > provenance.json
          jq . provenance.json > /dev/null
          rm -f toolchain-*.txt
          sha256sum provenance.json >> SHA256SUMS
          cat provenance.json
          gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --title "EAK prebuilt $tag (unsigned pre-release)" \
            --notes "Unsigned prebuilt bundles and the eak CLI built from commit $SHA, which passed CI ($CI_RUN). Verify with SHA256SUMS; build details are in provenance.json. Not a manufacturing-ready claim and not an installer-tested-on-hardware claim."

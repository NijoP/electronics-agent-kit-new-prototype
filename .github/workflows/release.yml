name: release
# Builds the desktop bundles and the `eak` CLI from ONE commit that the `ci` workflow already proved
# green, checksums them, and publishes a GitHub Release with a provenance file. Two triggers:
#   - a version tag push: git tag v0.1.5-rc.1 <sha> && git push origin v0.1.5-rc.1
#     The tag must be vMAJOR.MINOR.PATCH[-PRERELEASE], MAJOR.MINOR.PATCH must equal the app version in
#     apps/desktop/src-tauri/tauri.conf.json at that commit, and the release is named after the tag
#     (a pre-release when the tag has a -suffix).
#   - manual dispatch: gh workflow run release.yml -R NijoP/electronics-agent-kit-new-prototype [-f sha=<full commit sha>]
#     publishes a pre-release tagged prebuilt-<date>-<sha7> (the tag the one-line installers pick).
# Every build is UNSIGNED (no signing secrets exist): Windows SmartScreen / macOS Gatekeeper apply.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full commit sha to release (empty = the tip of the selected ref). Its ci run must be green.'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  verify:
    name: verify the commit is green
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      ci_run: ${{ steps.pick.outputs.ci_run }}
      tag: ${{ steps.pick.outputs.tag }}
      tag_exists: ${{ steps.pick.outputs.tag_exists }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit id, got '$sha'" >&2; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            [ "$sha" = "$GITHUB_SHA" ] || { echo "a tag release builds the tagged commit $GITHUB_SHA; do not pass sha=$sha" >&2; exit 1; }
            [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]] \
              || { echo "version tags must look like v1.2.3 or v1.2.3-rc.1, got '$tag'" >&2; exit 1; }
            want="${BASH_REMATCH[1]}"
            if [ -n "${BASH_REMATCH[2]}" ]; then prerelease=true; else prerelease=false; fi
            have="$(gh api "repos/$GITHUB_REPOSITORY/contents/apps/desktop/src-tauri/tauri.conf.json?ref=$sha" --jq .content | base64 -d | jq -r .version)"
            [ "$have" = "$want" ] || { echo "tag $tag says version $want but the app at $sha is version $have: bump the version first" >&2; exit 1; }
            tag_exists=true
          else
            tag="prebuilt-$(date -u +%Y%m%d)-${sha:0:7}"
            prerelease=true
            tag_exists=false
          fi
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" --jq '.workflow_runs[0].html_url // empty')"
          [ -n "$run" ] || { echo "no successful ci run exists for $sha: refusing to release a commit CI has not proved" >&2; exit 1; }
          {
            echo "sha=$sha"
            echo "ci_run=$run"
            echo "tag=$tag"
            echo "tag_exists=$tag_exists"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $sha as $tag (prerelease: $prerelease; green ci run: $run)" | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    name: package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04, os: linux, arch: x86_64, bundles: 'deb,appimage' }
          - { name: windows-x86_64, runner: windows-latest, os: windows, arch: x86_64, bundles: nsis }
          - { name: macos-aarch64, runner: macos-latest, os: macos, arch: aarch64, bundles: dmg }
          - { name: macos-x86_64, runner: macos-15-intel, os: macos, arch: x86_64, bundles: dmg }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Linux system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev pkg-config file
      - name: Desktop bundles (unsigned)
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm run tauri -- build --ci --bundles "${{ matrix.bundles }}"
      - name: eak CLI and MCP server
        run: cargo build --release --locked -p eak-harness --bins
      - name: Collect assets, CLI archive and checksums
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist-assets"
          bash scripts/collect-release-assets.sh "${{ matrix.os }}" "${{ matrix.arch }}" "$out"
          bin=target/release
          if [ "${{ matrix.os }}" = windows ]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$bin/eak.exe','$bin/eak-mcp.exe' -DestinationPath '$out/eak-cli-windows-${{ matrix.arch }}.zip'"
          else
            tar -C "$bin" -czf "$out/eak-cli-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" eak eak-mcp
          fi
          {
            echo "runner_image: ${{ matrix.runner }} ($RUNNER_OS $RUNNER_ARCH)"
            echo "rustc: $(rustc -V)"
            echo "cargo: $(cargo -V)"
            echo "node: $(node -v)"
            echo "npm: $(npm -v)"
          } > "$out/toolchain-${{ matrix.name }}.txt"
          cd "$out"
          rm -f SHA256SUMS
          files="$(ls | grep -v '^toolchain-')"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -- $files > "SHA256SUMS.${{ matrix.name }}"; else shasum -a 256 -- $files > "SHA256SUMS.${{ matrix.name }}"; fi
          cat "SHA256SUMS.${{ matrix.name }}"
      - name: Installer smoke test with the verified local assets (Linux, macOS)
        if: matrix.os != 'windows'
        env:
          EAK_ASSET_DIR: ${{ github.workspace }}/dist-assets
          EAK_NO_LAUNCH: '1'
        run: |
          set -euo pipefail
          cp "$EAK_ASSET_DIR/SHA256SUMS.${{ matrix.name }}" "$EAK_ASSET_DIR/SHA256SUMS"
          bash scripts/install.sh
          bash scripts/install.sh --uninstall
          rm -f "$EAK_ASSET_DIR/SHA256SUMS"
      - name: Installer smoke test with the verified local assets (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          EAK_ASSET_DIR: ${{ github.workspace }}\dist-assets
          EAK_NO_LAUNCH: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item "$env:EAK_ASSET_DIR\SHA256SUMS.${{ matrix.name }}" "$env:EAK_ASSET_DIR\SHA256SUMS"
          & ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          $env:EAK_UNINSTALL = '1'
          & ./scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          Remove-Item "$env:EAK_ASSET_DIR\SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: eak-${{ matrix.name }}
          path: dist-assets/*
          if-no-files-found: error

  publish:
    name: publish pre-release
    needs: [verify, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Combine checksums, write provenance, publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verify.outputs.sha }}
          CI_RUN: ${{ needs.verify.outputs.ci_run }}
          TAG: ${{ needs.verify.outputs.tag }}
          TAG_EXISTS: ${{ needs.verify.outputs.tag_exists }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd assets
          cat SHA256SUMS.* | sort -k2 > SHA256SUMS
          rm -f SHA256SUMS.*
          # Every listed file must exist and hash to its listed value.
          sha256sum -c SHA256SUMS
          tag="$TAG"
          {
            echo '{'
            echo "  \"commit\": \"$SHA\","
            echo "  \"tag\": \"$tag\","
            echo "  \"ci_run\": \"$CI_RUN\","
            echo "  \"release_run\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\","
            echo "  \"built_at_utc\": \"$(date -u +%FT%TZ)\","
            echo '  "signing": "unsigned (no signing secrets exist)",'
            echo '  "toolchains": {'
            first=1
            for t in toolchain-*.txt; do
              [ "$first" = 1 ] || echo ','
              first=0
              printf '    "%s": %s' "${t#toolchain-}" "$(jq -Rs . < "$t")"
            done
            echo
            echo '  },'
            echo '  "sha256": {'
            awk 'NR>1{printf ",\n"} {n=$2; sub(/^\*/, "", n); printf "    \"%s\": \"%s\"", n, $1}' SHA256SUMS
            echo
            echo '  }'
            echo '}'
          } > provenance.json
          jq . provenance.json > /dev/null
          rm -f toolchain-*.txt
          sha256sum provenance.json >> SHA256SUMS
          cat provenance.json
          # The tag points at exactly the CI-green commit (a pushed version tag already does; verify
          # checked it); the release is then made from that tag.
          if [ "$TAG_EXISTS" != true ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA" > /dev/null
          fi
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); kind='unsigned pre-release'; else pre=(); kind='unsigned'; fi
          case "$tag" in prebuilt-*) title="EAK prebuilt $tag ($kind)" ;; *) title="EAK $tag ($kind)" ;; esac
          gh release create "$tag" ./* --repo "$GITHUB_REPOSITORY" --verify-tag "${pre[@]}" \
            --title "$title" \
            --notes "Unsigned prebuilt bundles and the eak CLI built from commit $SHA, which passed CI ($CI_RUN). Verify with SHA256SUMS; build details are in provenance.json. Windows SmartScreen and macOS Gatekeeper will warn because nothing is code-signed or notarized. Not a manufacturing-ready claim and not an installer-tested-on-hardware claim."

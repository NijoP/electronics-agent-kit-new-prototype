name: release
on:
  push:
    branches: [refactor/eak-product-realignment-herdr, 'fm/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
env:
  # No signing secrets exist: every build is UNSIGNED (Windows SmartScreen / macOS Gatekeeper apply).
  CARGO_TERM_COLOR: always
jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04, os: linux, arch: x86_64, triple: x86_64-unknown-linux-gnu, bundles: 'deb,appimage' }
          - { name: windows-x86_64, runner: windows-latest, os: windows, arch: x86_64, triple: x86_64-pc-windows-msvc, bundles: nsis }
          - { name: macos-aarch64, runner: macos-14, os: macos, arch: aarch64, triple: aarch64-apple-darwin, bundles: dmg }
          - { name: macos-x86_64, runner: macos-15-intel, os: macos, arch: x86_64, triple: x86_64-apple-darwin, bundles: dmg }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - name: Linux system libraries
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev pkg-config xvfb file
      - name: Stage pinned Herdr runtime as Tauri sidecar
        run: bash scripts/fetch-herdr.sh "${{ matrix.triple }}"
      - name: Build bundles (unsigned)
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          cfg=tauri.release.conf.json
          [ "${{ matrix.os }}" = windows ] && cfg=tauri.release.windows.conf.json
          npm ci --no-audit --no-fund
          npm run tauri -- build --ci --bundles "${{ matrix.bundles }}" --config "src-tauri/$cfg"
      - name: Collect assets and checksums
        run: bash scripts/collect-release-assets.sh "${{ matrix.os }}" "${{ matrix.arch }}" "$GITHUB_WORKSPACE/dist-assets"
      - name: Smoke test - piped installer, launch check, bundled Herdr, uninstall (Linux/macOS)
        if: matrix.os != 'windows'
        env:
          EAK_ASSET_DIR: ${{ github.workspace }}/dist-assets
        run: |
          set -o pipefail
          {
            echo "### ${{ matrix.name }} smoke test (unsigned build)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          { cat scripts/install.sh | bash 2>&1 | tee -a smoke.log; } || { echo '```' >> "$GITHUB_STEP_SUMMARY"; cat "$HOME/.local/state/eak/install.log" 2>/dev/null || true; exit 1; }
          # second run: must be idempotent
          cat scripts/install.sh | bash 2>&1 | tee -a smoke.log
          cat scripts/install.sh | bash -s -- --uninstall 2>&1 | tee -a smoke.log
          tail -n 40 smoke.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test - Debian package install (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get install -y ./dist-assets/eak-linux-x86_64.deb
          ls -l /usr/bin/herdr /usr/bin/eak-desktop
          /usr/bin/herdr --version | tee -a "$GITHUB_STEP_SUMMARY"
          sudo apt-get remove -y eak
      - name: Smoke test - piped installer, launch check, bundled Herdr, uninstall (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          EAK_ASSET_DIR: ${{ github.workspace }}\dist-assets
        run: |
          $ErrorActionPreference = 'Stop'
          "### ${{ matrix.name }} smoke test (unsigned build)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Get-Content scripts/install.ps1 -Raw | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:LOCALAPPDATA\EAK-install\install.log" -ErrorAction SilentlyContinue; throw "install failed" }
          Get-Content scripts/install.ps1 -Raw | Invoke-Expression   # idempotent re-run
          $env:EAK_UNINSTALL = '1'
          Get-Content scripts/install.ps1 -Raw | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { throw "uninstall failed" }
          Get-Content "$env:LOCALAPPDATA\EAK-install\install.log" -Tail 30 | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        with:
          name: eak-${{ matrix.name }}
          path: dist-assets/*
          if-no-files-found: error

  release:
    name: publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Combine checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "EAK ${GITHUB_REF_NAME} (unsigned)" \
            --notes "Unsigned prerelease builds (no Windows code-signing certificate or Apple Developer credentials are available): Windows SmartScreen and macOS Gatekeeper will warn. See docs/INSTALL.md and docs/PLATFORM_SUPPORT.md. Verify downloads against SHA256SUMS." \
            ./*
